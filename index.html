        g1 + (g2 - g1) * t,
        b1 + (b2 - b1) * t
      );
    }
  }

  /**
   * Synchronizes the biological state of the living bonsai with the Three.js InstancedMeshes.
   * @param {object} bonsai - LivingBonsaiOrganism instance
   * @param {number} timeSec - Elapsed animation time in seconds
   * @param {object} interactionState - { hoveredSegId, hoveredBudId, hoveredLeafId, hoveredDescSet, activeTool, seasonTheme }
   * @returns {{ activeBudCount: number, activeLeafCount: number, activeBranchCount: number, trunkCaliberMm: number }}
   */
  syncBiology(bonsai, timeSec = 0, interactionState = {}) {
    if (!bonsai) {
      return { activeBudCount: 0, activeLeafCount: 0, activeBranchCount: 0, trunkCaliberMm: 0 };
    }

    const {
      hoveredSegId = null,
      hoveredBudId = null,
      hoveredLeafId = null,
      hoveredDescSet = null,
      activeTool = 'PRUNE',
      seasonTheme = 'SPRING'
    } = interactionState;

    // 0. Determine Season from biological organism or interaction override
    const seasonInfo = (typeof bonsai.getSeasonInfo === 'function')
      ? bonsai.getSeasonInfo()
      : null;

    let seasonIndex = 0; // 0: Primavera (Spring), 1: Verano (Summer), 2: Otoño (Autumn), 3: Invierno (Winter)
    let seasonName = 'PRIMAVERA';
    let seasonProgress = 0.0;
    let year = 1;

    if (seasonInfo) {
      seasonIndex = (seasonInfo.seasonIndex !== undefined) ? seasonInfo.seasonIndex : 0;
      seasonName = seasonInfo.seasonName || ['PRIMAVERA', 'VERANO', 'OTOÑO', 'INVIERNO'][seasonIndex];
      seasonProgress = (seasonInfo.seasonProgress !== undefined) ? seasonInfo.seasonProgress : 0.0;
      year = seasonInfo.year || 1;
    } else if (typeof bonsai.simDays === 'number') {
      const d = ((bonsai.simDays % 360) + 360) % 360;
      seasonIndex = Math.floor(d / 90);
      seasonProgress = (d % 90) / 90;
      year = Math.floor(bonsai.simDays / 360) + 1;
      seasonName = ['PRIMAVERA', 'VERANO', 'OTOÑO', 'INVIERNO'][seasonIndex];
    }

    // UI explicit season override if provided
    if (interactionState.seasonOverride !== undefined && interactionState.seasonOverride !== null) {
      seasonIndex = Number(interactionState.seasonOverride) % 4;
      seasonName = ['PRIMAVERA', 'VERANO', 'OTOÑO', 'INVIERNO'][seasonIndex];
    }

    // Update moss mound tone according to season
    if (this.mossMat) {
      if (seasonIndex === 0) {
        this.mossMat.color.setRGB(0.34, 0.66, 0.30); // Spring fresh velvet green
      } else if (seasonIndex === 1) {
        this.mossMat.color.setRGB(0.24, 0.51, 0.20); // Summer deep emerald
      } else if (seasonIndex === 2) {
        this.mossMat.color.setRGB(0.36, 0.45, 0.20); // Autumn warm olive
      } else {
        this.mossMat.color.setRGB(0.27, 0.35, 0.22); // Winter cool dormant moss
      }
    }

    // Swap leaf BufferGeometry whenever species changes (Acer palmatum primary)
    if (bonsai.species && bonsai.species !== this.currentSpecies) {
      const nextGeom = this.speciesGeometries[bonsai.species] || this.speciesGeometries.BONSAI_MAPLE;
      this.leafInstanced.geometry = nextGeom;
      this.currentSpecies = bonsai.species;
    }

    let cylIdx = 0;
    let sphIdx = 0;
    let leafIdx = 0;

    const dummyObj = this._dummyObj;
    const tmpColor = this._tmpColor;
    const upVec = this._upVec;
    const segVec = this._segVec;
    const midVec = this._midVec;

    const pushCylinder = (x0, y0, z0, x1, y1, z1, r0, r1, color) => {
      if (cylIdx >= MAX_CYLINDERS) return;
      segVec.set(x1 - x0, y1 - y0, z1 - z0);
      const len = segVec.length();
      if (len < 0.08) return;

      midVec.set((x0 + x1) * 0.5, (y0 + y1) * 0.5, (z0 + z1) * 0.5);
      dummyObj.position.copy(midVec);
      dummyObj.quaternion.setFromUnitVectors(upVec, segVec.normalize());
      const avgR = Math.max(0.35, (r0 + r1) * 0.5);
      dummyObj.scale.set(avgR, len, avgR);
      dummyObj.updateMatrix();

      this.cylInstanced.setMatrixAt(cylIdx, dummyObj.matrix);
      this.cylInstanced.setColorAt(cylIdx, color);
      cylIdx++;
    };

    const pushSphere = (x, y, z, rx, ry, rz, color) => {
      if (sphIdx >= MAX_SPHERES) return;
      dummyObj.position.set(x, y, z);
      dummyObj.rotation.set(0, 0, 0);
      dummyObj.scale.set(rx, ry, rz);
      dummyObj.updateMatrix();

      this.sphereInstanced.setMatrixAt(sphIdx, dummyObj.matrix);
      this.sphereInstanced.setColorAt(sphIdx, color);
      sphIdx++;
    };

    // 1. Nebari Surface Roots
    if (bonsai.nebariRoots) {
      tmpColor.setRGB(0.68, 0.64, 0.56);
      for (const r of bonsai.nebariRoots) {
        pushCylinder(r.x0, r.y0, r.z0, r.x1, r.y1, r.z1, r.r0, r.r1, tmpColor);
      }
    }

    // 2. White Tamahi Organic Fertilizer Cakes on the Soil Rim
    if (bonsai.pellets) {
      tmpColor.setRGB(0.88, 0.85, 0.78);
      for (const p of bonsai.pellets) {
        pushSphere(p.x, p.y, p.z, p.rx, p.ry, p.rx, tmpColor);
      }
    }

    // 3. Trunk, Chopped Trunk Heads & Fractal Internode Branches
    let activeBranchCount = 0;
    for (const seg of bonsai.segments) {
      if (seg.pruned) continue;

      const curT = seg.curT !== undefined ? seg.curT : 1.0;
      const curX1 = seg.x0 + (seg.x1 - seg.x0) * curT;
      const curY1 = seg.y0 + (seg.y1 - seg.y0) * curT;
      const curZ1 = seg.z0 + (seg.z1 - seg.z0) * curT;

      const isDescHovered = hoveredDescSet ? hoveredDescSet.has(seg.id) : false;
      const isDirectlyHovered = hoveredSegId === seg.id;
      const isCutHighlight = (activeTool === 'PRUNE' && (isDescHovered || isDirectlyHovered));

      if (seg.type !== 'TRUNK' && seg.type !== 'TRUNK_HEAD') {
        activeBranchCount++;
      }

      if (isCutHighlight) {
        tmpColor.setRGB(1.0, 0.30, 0.40);
      } else if (activeTool === 'PINCH' && isDirectlyHovered) {
        tmpColor.setRGB(0.35, 0.98, 0.78);
      } else {
        const effectiveWoodiness = (seg.type === 'TRUNK' || seg.type === 'TRUNK_HEAD')
          ? Math.max(0.85, seg.woodiness ?? 1.0)
          : (seg.woodiness ?? 0.0);
        this._setBarkColor(tmpColor, effectiveWoodiness, bonsai.species, seasonIndex, seasonProgress);
      }

      pushCylinder(seg.x0, seg.y0, seg.z0, curX1, curY1, curZ1, seg.r0, seg.r1, tmpColor);

      // Nodal bark ridge on lignified segments so thickened seedling shoots show realistic trunk rings
      if (!isCutHighlight && (seg.woodiness > 0.55 || seg.r0 > 4.0) && seg.curT >= 0.98) {
        this._setBarkColor(tmpColor, Math.min(1.0, (seg.woodiness || 0.6) + 0.12), bonsai.species, seasonIndex, seasonProgress);
        pushSphere(curX1, curY1, curZ1, seg.r1 * 1.08, Math.max(1.2, seg.r1 * 0.32), seg.r1 * 1.08, tmpColor);
      }

      // Render Copper Training Wire Coils if segment is wired
      if (seg.hasWire && !isCutHighlight) {
        tmpColor.setRGB(0.85, 0.52, 0.28);
        for (let wStep = 0.25; wStep <= 0.75; wStep += 0.25) {
          if (curT < wStep) break;
          const wx = seg.x0 + (seg.x1 - seg.x0) * wStep;
          const wy = seg.y0 + (seg.y1 - seg.y0) * wStep;
          const wz = seg.z0 + (seg.z1 - seg.z0) * wStep;
          const wr = (seg.r0 * (1 - wStep) + seg.r1 * wStep) * 1.18;
          pushSphere(wx, wy, wz + 0.8, Math.max(1.2, wr), 1.1, Math.max(1.2, wr), tmpColor);
        }
      }

      // Render Chop Scars / Cut Paste / Fresh Green Cut Disc at top of chopped segments
      if (seg.hasChopScar && curT >= 0.95 && !isCutHighlight) {
        if (seg.scarStyle === 'DARK_PASTE') {
          tmpColor.setRGB(0.38, 0.43, 0.48); // Grey Japanese cut-paste seal
          pushSphere(curX1, curY1, curZ1 + 2.0, seg.r1 * 0.85, 3.2, seg.r1 * 0.85, tmpColor);
        } else if (seg.scarStyle === 'FRESH_GREEN_CUT') {
          tmpColor.setRGB(0.78, 0.95, 0.65); // Fresh green-white cambium ring after pruning
          pushSphere(curX1, curY1, curZ1 + 2.0, Math.max(1.8, seg.r1 * 1.25), 2.3, Math.max(1.8, seg.r1 * 1.25), tmpColor);
        } else {
          tmpColor.setRGB(0.82, 0.78, 0.66); // Healed callus bevel
          pushSphere(curX1, curY1, curZ1 + 1.5, seg.r1 * 0.82, 2.8, seg.r1 * 0.82, tmpColor);
        }
      }

      // Clean cut / pinch ring indicator on hovered segment
      if (isDirectlyHovered) {
        if (activeTool === 'PRUNE') {
          tmpColor.setRGB(1.0, 0.25, 0.45);
          pushSphere(seg.x0, seg.y0, seg.z0 + 4.0, Math.max(3.5, seg.r0 * 1.55), 2.2, 3.5, tmpColor);
        } else if (activeTool === 'PINCH') {
          tmpColor.setRGB(0.25, 1.0, 0.78);
          pushSphere(curX1, curY1, curZ1 + 4.0, Math.max(3.2, seg.r1 * 1.5), 2.2, 3.2, tmpColor);
        }
      }
    }

    // 4. Axillary Leaf-Buds (AXILLARY_LEAF_BUD) & Collar/Latent Buds
    let activeBudCount = 0;
    const isDeciduousWinter = (seasonIndex === 3);

    if (bonsai.buds) {
      for (const bud of bonsai.buds) {
        if (bud.pruned || bud.state === 'SPENT') continue;
        const pSeg = bonsai.SegmentMap ? bonsai.SegmentMap.get(bud.parentSegId) : null;
        if (!pSeg || pSeg.pruned || (pSeg.curT !== undefined && pSeg.curT < 0.90)) continue;

        const isBudHovered = hoveredBudId === bud.id;
        // Offset slightly into the upper leaf-axil pocket so the bud is distinctly visible between stem & petiole
        const axilOffsetX = (bud.side || 0) * 1.15;
        const axilOffsetY = bud.type === 'AXILLARY_LEAF_BUD' ? 1.1 : 0.0;
        const bx = bud.x + axilOffsetX;
        const by = bud.y + axilOffsetY;
        const bz = (bud.z || 0) + 3.2;

        if (isBudHovered) {
          activeBudCount++;
          const pulse = 1.0 + Math.sin(timeSec * 8.0) * 0.18;
          tmpColor.setRGB(0.22, 1.0, 0.80); // Bright cyan-lime hover highlight
          pushSphere(bx, by, bz + 2.0, 3.1 * pulse, 3.6 * pulse, 3.1 * pulse, tmpColor);
        } else if (bud.state === 'SWELLING') {
          activeBudCount++;
          // Spring bud break: glowing crimson-lime swelling bud breaking dormancy!
          const budPhase = typeof bud.id === 'number'
            ? bud.id
            : (parseInt(String(bud.id).replace(/\D+/g, ''), 10) || 0);
          const pulse = 1.0 + Math.sin(timeSec * 6.0 + budPhase) * 0.15;
          const swell = bud.swell || 0.35;
          const r = (2.1 + swell * 2.3) * pulse;
          tmpColor.setRGB(0.96 - swell * 0.22, 0.54 + swell * 0.42, 0.34);
          pushSphere(bx, by, bz + 1.5, r, r * 1.32, r, tmpColor);
        } else if (isDeciduousWinter) {
          // Invierno (Winter): dormant winter bud scales visible at each node
          activeBudCount++;
          tmpColor.setRGB(0.86, 0.28, 0.30); // Deep ruby-crimson protective perulae / bud scales
          pushSphere(bx, by, bz, 1.85, 2.35, 1.85, tmpColor);
        } else {
          // Dormant Axillary Leaf-Bud or Latent Collar Bud: warm ruby-amber scale
          activeBudCount++;
          const isAxillary = bud.type === 'AXILLARY_LEAF_BUD';
          if (isAxillary) {
            tmpColor.setRGB(0.88, 0.46, 0.34);
            pushSphere(bx, by, bz, 1.75, 2.15, 1.75, tmpColor);
          } else {
            tmpColor.setRGB(0.76, 0.42, 0.35);
            pushSphere(bx, by, bz, 1.55, 1.85, 1.55, tmpColor);
          }
        }
      }
    }

    // 5. Petioles & Species-Specific Leaf Blades (Maple / Ulmus / Pine)
    // NOTE: In Invierno (Winter), the crown has ZERO leaves on the branches (all leaves abscised)!
    let activeLeafCount = 0;

    if (!isDeciduousWinter && bonsai.leaves) {
      for (const lf of bonsai.leaves) {
        if (lf.pruned) continue;
        const pSeg = bonsai.SegmentMap ? bonsai.SegmentMap.get(lf.parentSegId) : null;
        if (!pSeg || pSeg.pruned) continue;

        activeLeafCount++;
        const isDescHovered = hoveredDescSet ? hoveredDescSet.has(lf.parentSegId) : false;
        const isLeafHovered = hoveredLeafId === lf.id ||
          (activeTool === 'PINCH' && hoveredSegId === lf.parentSegId);
        const isCutHighlight = (activeTool === 'PRUNE' && isDescHovered);

        // Gentle organic breeze sway
        const breeze = Math.sin(timeSec * 2.2 + lf.x * 0.05 + lf.y * 0.04) * 0.06;
        const age = lf.age !== undefined ? lf.age : 1.0;
        const curPetioleLen = (lf.petioleLen || 8.0) * (0.3 + 0.7 * age);
        const pAngle = (lf.angle || 0) + breeze;

        const bladeBaseX = lf.x + Math.sin(pAngle) * curPetioleLen;
        const bladeBaseY = lf.y + Math.cos(pAngle) * curPetioleLen - 1.8 * age;
        const bladeBaseZ = (lf.z || 0) + 4.0 + (lf.side || 1) * 3.0;

        // Slender petiole color: tender coral in spring, red in summer, intense scarlet in autumn
        if (isCutHighlight) {
          tmpColor.setRGB(1.0, 0.30, 0.35);
        } else if (isLeafHovered) {
          tmpColor.setRGB(1.0, 0.78, 0.25);
        } else if (seasonIndex === 0) {
          tmpColor.setRGB(0.88, 0.36, 0.32); // Spring tender coral-red petiole
        } else if (seasonIndex === 1) {
          tmpColor.setRGB(0.82, 0.30, 0.30); // Summer red petiole
        } else {
          tmpColor.setRGB(0.92, 0.22, 0.22); // Autumn intense scarlet petiole
        }
        pushCylinder(lf.x, lf.y, lf.z || 0, bladeBaseX, bladeBaseY, bladeBaseZ, 0.65, 0.55, tmpColor);

        // Species Leaf Blade Instance
        if (leafIdx < MAX_LEAVES) {
          // Spring: leaves emerge small and expand as they unfurl
          let expansion = Math.pow(age, 0.82);
          if (seasonIndex === 0) {
            expansion *= Math.min(1.0, 0.35 + 0.65 * (seasonProgress / 0.60));
          }
          const radius = (lf.maxRadius || 16.0) * (0.18 + 0.82 * expansion);
          dummyObj.position.set(bladeBaseX, bladeBaseY, bladeBaseZ);
          dummyObj.rotation.set(0.22, (lf.tiltZ || 0) * 0.35, -pAngle);
          dummyObj.scale.set(radius, radius, radius);
          dummyObj.updateMatrix();
          this.leafInstanced.setMatrixAt(leafIdx, dummyObj.matrix);

          const shade = lf.shadeLayer !== undefined ? lf.shadeLayer : 0.5;
          const hueOff = (lf.hueOffset || 0) * 0.002;

          if (isCutHighlight) {
            tmpColor.setRGB(1.0, 0.28, 0.38);
          } else if (isLeafHovered) {
            // Bright amber-cyan highlight in PINCH / Mekiri defoliation mode
            tmpColor.setRGB(1.0, 0.76, 0.24);
          } else if (seasonIndex === 0) {
            // ==========================================
            // 🌸 PRIMAVERA (Spring)
            // Leaves emerge small with bronze-red/apricot hues, unfurling to vibrant yellow-green/lime
            // ==========================================
            const unfurlFrac = Math.min(1.0, Math.max(0.0, age * 0.65 + seasonProgress * 0.55));
            if (unfurlFrac < 0.42) {
              // Bronze-red / apricot newly unfurled leaf protected by anthocyanins
              const apricotMix = unfurlFrac / 0.42;
              const hue = 0.03 + apricotMix * 0.05; // 0.03 (bronze-red) -> 0.08 (apricot)
              tmpColor.setHSL(hue, 0.85, 0.36 + shade * 0.20);
            } else {
              // Unfurling to vibrant yellow-green / lime
              const limeMix = (unfurlFrac - 0.42) / 0.58;
              const hue = 0.08 * (1.0 - limeMix) + (0.28 + hueOff) * limeMix;
              tmpColor.setHSL(hue, 0.84, 0.32 + shade * 0.26);
            }
          } else if (seasonIndex === 1) {
            // ==========================================
            // ☀️ VERANO (Summer)
            // Full canopy of deep lush emerald green leaves. High contrast, vigorous appearance.
            // ==========================================
            const baseHue = 0.33 + hueOff; // Lush emerald forest green
            const sat = 0.90;
            const light = 0.22 + shade * 0.26; // High contrast between sun canopy & deep interior
            tmpColor.setHSL(baseHue, sat, light);
          } else if (seasonIndex === 2) {
            // ==========================================
            // 🍁 OTOÑO (Autumn - Momiji)
            // Leaves smoothly transition into stunning Momiji autumn foliage — vivid scarlet,
            // fiery crimson, deep vermilion, orange, and golden-amber. Individual variance in senescence.
            // ==========================================
            const leafIdNum = typeof lf.id === 'number'
              ? lf.id
              : (parseInt(String(lf.id).replace(/\D+/g, ''), 10) || 0);
            const varVal = (Math.abs(Math.sin(leafIdNum * 12.9898 + lf.x * 0.17 + lf.y * 0.23)) * 1000) % 1;
            const senProgress = Math.max(0.0, Math.min(1.0, seasonProgress * 1.35 - varVal * 0.32));

            if (senProgress < 0.25) {
              // Early autumn: emerald green transitioning into chartreuse and golden-amber tips
              const t = senProgress / 0.25;
              const hue = 0.32 * (1.0 - t) + 0.13 * t; // green -> amber
              tmpColor.setHSL(hue + hueOff, 0.88, 0.26 + shade * 0.24);
            } else {
              // Peak Momiji: individual leaves turn vivid scarlet, fiery crimson, vermilion or golden amber
              const colorType = Math.floor(varVal * 4.0);
              let peakHue;
              if (colorType === 0) {
                peakHue = 0.99; // Vivid Scarlet (ruby-red)
              } else if (colorType === 1) {
                peakHue = 0.96; // Fiery Crimson
              } else if (colorType === 2) {
                peakHue = 0.04; // Deep Vermilion / Flame Orange
              } else {
                peakHue = 0.10; // Glowing Golden-Amber
              }
              const t = (senProgress - 0.25) / 0.75;
              const curHue = (0.13 * (1.0 - t) + peakHue * t) % 1.0;
              const sat = 0.88 + varVal * 0.08;
              const light = 0.30 + shade * 0.22;
              tmpColor.setHSL(curHue, sat, light);
            }
          }

          this.leafInstanced.setColorAt(leafIdx, tmpColor);
          leafIdx++;
        }
      }
    }

    // 6. Resting Fallen Momiji Leaves on the Velvet Moss and Pot Rim Lip (Winter & Late Autumn)
    if (isDeciduousWinter || (seasonIndex === 2 && seasonProgress > 0.70)) {
      const winterOpacity = isDeciduousWinter
        ? 1.0
        : Math.min(1.0, (seasonProgress - 0.70) / 0.25);

      for (const fl of this._winterFallenLeaves) {
        if (leafIdx >= MAX_LEAVES) break;
        dummyObj.position.set(fl.x, fl.y, fl.z);
        dummyObj.rotation.set(fl.rotX, fl.rotY, fl.rotZ);
        dummyObj.scale.set(fl.scale, fl.scale, fl.scale);
        dummyObj.updateMatrix();
        this.leafInstanced.setMatrixAt(leafIdx, dummyObj.matrix);

        tmpColor.setHSL(fl.hue, fl.sat, fl.light * (0.85 + 0.15 * winterOpacity));
        this.leafInstanced.setColorAt(leafIdx, tmpColor);
        leafIdx++;
      }
    }

    // 7. Falling Pruned Clippings & Abscised Old Leaves Animation
    if (bonsai.fallingClips) {
      // Keep falling clips pool bounded for 60-120 FPS performance during high-speed time jumps
      if (bonsai.fallingClips.length > 60) {
        bonsai.fallingClips.splice(0, bonsai.fallingClips.length - 60);
      }
      for (let i = bonsai.fallingClips.length - 1; i >= 0; i--) {
        const clip = bonsai.fallingClips[i];
        clip.x += clip.vx || 0;
        clip.y += clip.vy || -1.0;
        clip.vy = (clip.vy || 0) - 0.18;
        clip.alpha = (clip.alpha !== undefined ? clip.alpha : 1.0) - 0.032;
        if (clip.alpha <= 0) {
          bonsai.fallingClips.splice(i, 1);
          continue;
        }
        if (leafIdx < MAX_LEAVES) {
          const clipScale = clip.radius || clip.r || 15;
          dummyObj.position.set(clip.x, clip.y, (clip.z || 0) + 10);
          dummyObj.rotation.set(0.3, 0.2, clip.alpha * 3.0);
          dummyObj.scale.set(clipScale, clipScale, clipScale);
          dummyObj.updateMatrix();
          this.leafInstanced.setMatrixAt(leafIdx, dummyObj.matrix);
          if (seasonIndex === 2 || seasonIndex === 3) {
            tmpColor.setRGB(0.95 * clip.alpha, 0.32 * clip.alpha, 0.26 * clip.alpha);
          } else {
            tmpColor.setRGB(0.88 * clip.alpha, 0.72 * clip.alpha, 0.35 * clip.alpha);
          }
          this.leafInstanced.setColorAt(leafIdx, tmpColor);
          leafIdx++;
        }
      }
    }

    // Commit instance buffers to GPU
    this.cylInstanced.count = cylIdx;
    this.cylInstanced.instanceMatrix.needsUpdate = true;
    if (this.cylInstanced.instanceColor) this.cylInstanced.instanceColor.needsUpdate = true;

    this.sphereInstanced.count = sphIdx;
    this.sphereInstanced.instanceMatrix.needsUpdate = true;
    if (this.sphereInstanced.instanceColor) this.sphereInstanced.instanceColor.needsUpdate = true;

    this.leafInstanced.count = leafIdx;
    this.leafInstanced.instanceMatrix.needsUpdate = true;
    if (this.leafInstanced.instanceColor) this.leafInstanced.instanceColor.needsUpdate = true;

    const baseTrunk = bonsai.segments && bonsai.segments[0];
    const trunkCaliberMm = baseTrunk ? +(baseTrunk.r0 * 1.45).toFixed(1) : 0.0;

    return {
      activeBudCount,
      activeLeafCount,
      activeBranchCount,
      trunkCaliberMm,
      seasonIndex,
      seasonName,
      seasonProgress,
      year
    };
  }

  /**
   * Renders Pass 1 (3D Botanical Scene -> sceneRT) and Pass 2 (ASCII Shader -> Screen).
   */
  render() {
    this.renderer.setRenderTarget(this.sceneRT);
    this.renderer.render(this.bioScene, this.orthoCamera);

    this.renderer.setRenderTarget(null);
    this.renderer.render(this.asciiPostScene, this.asciiPostCam);
  }

  /**
   * Updates WebGLRenderer viewport, supersampled offscreen RenderTarget size, and camera projection.
   * @param {number} width
   * @param {number} height
   * @param {object} [cameraController]
   */
  resize(width, height, cameraController = null) {
    this.viewW = Math.max(1, width || window.innerWidth);
    this.viewH = Math.max(1, height || window.innerHeight);

    this.renderer.setSize(this.viewW, this.viewH);

    if (cameraController && typeof cameraController.updateProjection === 'function') {
      cameraController.updateProjection(this.viewW, this.viewH);
    } else {
      const aspect = this.viewW / this.viewH;
      const frustumH = 380;
      const frustumW = frustumH * aspect;
      this.orthoCamera.left = -frustumW / 2;
      this.orthoCamera.right = frustumW / 2;
      this.orthoCamera.top = frustumH * 0.78;
      this.orthoCamera.bottom = -frustumH * 0.22;
      this.orthoCamera.updateProjectionMatrix();
    }

    const rtW = Math.max(256, Math.floor(this.viewW / 2.2));
    const rtH = Math.max(256, Math.floor(this.viewH / 2.2));
    this.sceneRT.setSize(rtW, rtH);

    this.asciiShaderMat.uniforms.uResolution.value.set(this.viewW, this.viewH);
  }

  /**
   * @returns {HTMLCanvasElement}
   */
  getDomElement() {
    return this.renderer.domElement;
  }

  /**
   * @returns {THREE.OrthographicCamera}
   */
  getCamera() {
    return this.orthoCamera;
  }
}


/* --- MODULE: src/audio/BonsaiAudioSynth.js --- */
/* ====================================================================
   BONSAI ZEN WEB AUDIO SYNTHESIZER
   ==================================================================== */

class BonsaiAudioSynth {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  init() {
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }

  playSnip() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1700, now);
      filter.frequency.exponentialRampToValueAtTime(3500, now + 0.04);

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(2300, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.055);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + 0.065);
    } catch (e) {
      // Ignore audio context restrictions
    }
  }

  playBudPop() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(980, now + 0.09);

      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + 0.15);
    } catch (e) {
      // Ignore audio context restrictions
    }
  }

  playSeasonChime() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const freqs = [528, 792, 1056];
      freqs.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const start = now + idx * 0.045;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.01, start + 0.32);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.065 / (idx + 1), start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(start);
        osc.stop(start + 0.36);
      });
    } catch (e) {
      // Ignore audio context restrictions
    }
  }
}


/* --- MODULE: src/interaction/CameraController.js --- */
/* ====================================================================
   2D ORTHOGRAPHIC CAMERA CONTROLLER (ZOOM, PAN & AUTO-FIT)
   ==================================================================== */

class CameraController {
  constructor(orthoCamera) {
    this.orthoCamera = orthoCamera;
    this.baseFrustumH = 380;

    this.minZoom = 0.25;
    this.maxZoom = 3.50;

    this.zoom = 1.0;
    this.targetZoom = 1.0;

    this.panX = 0.0;
    this.panY = 0.0;
    this.targetPanX = 0.0;
    this.targetPanY = 0.0;
  }

  updateProjection(viewW, viewH) {
    if (!this.orthoCamera) return;
    const safeW = Math.max(1, viewW || window.innerWidth || 1024);
    const safeH = Math.max(1, viewH || window.innerHeight || 768);
    const aspect = safeW / safeH;

    const frustumH = this.baseFrustumH / Math.max(0.05, this.zoom);
    const frustumW = frustumH * aspect;

    // Center around (this.panX, this.panY + frustumH * 0.28)
    // so at zoom = 1, pan = 0 the pot sits nicely near the bottom (top = 0.78*H, bottom = -0.22*H)
    const centerX = this.panX;
    const centerY = this.panY + frustumH * 0.28;

    this.orthoCamera.left = centerX - frustumW * 0.5;
    this.orthoCamera.right = centerX + frustumW * 0.5;
    this.orthoCamera.top = centerY + frustumH * 0.5;
    this.orthoCamera.bottom = centerY - frustumH * 0.5;
    this.orthoCamera.updateProjectionMatrix();
  }

  update(dt, viewW, viewH) {
    const safeDt = Math.min(0.1, Math.max(0.001, dt || 0.016));
    const lerpFactor = 1.0 - Math.exp(-safeDt * 14.0);

    this.zoom += (this.targetZoom - this.zoom) * lerpFactor;
    this.panX += (this.targetPanX - this.panX) * lerpFactor;
    this.panY += (this.targetPanY - this.panY) * lerpFactor;

    if (Math.abs(this.targetZoom - this.zoom) < 0.0005) this.zoom = this.targetZoom;
    if (Math.abs(this.targetPanX - this.panX) < 0.01) this.panX = this.targetPanX;
    if (Math.abs(this.targetPanY - this.panY) < 0.01) this.panY = this.targetPanY;

    this.updateProjection(viewW, viewH);
    return this.zoom;
  }

  screenToWorld(clientX, clientY, domElement) {
    const rect = domElement.getBoundingClientRect();
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);

    const ndcX = ((clientX - rect.left) / width) * 2 - 1;
    const ndcY = -((clientY - rect.top) / height) * 2 + 1;

    const worldX =
      this.orthoCamera.left +
      (ndcX + 1) * 0.5 * (this.orthoCamera.right - this.orthoCamera.left);
    const worldY =
      this.orthoCamera.bottom +
      (ndcY + 1) * 0.5 * (this.orthoCamera.top - this.orthoCamera.bottom);

    return { worldX, worldY, x: worldX, y: worldY };
  }

  zoomByWheel(deltaY, clientX, clientY, domElement) {
    const rect = domElement.getBoundingClientRect();
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);
    const aspect = width / height;

    const ndcX = ((clientX - rect.left) / width) * 2 - 1;
    const ndcY = -((clientY - rect.top) / height) * 2 + 1;

    // World point currently targeted under mouse cursor
    const oldZoom = this.targetZoom;
    const oldFrustumH = this.baseFrustumH / oldZoom;
    const oldFrustumW = oldFrustumH * aspect;

    const focalWorldX = this.targetPanX + ndcX * (oldFrustumW * 0.5);
    const focalWorldY =
      this.targetPanY + oldFrustumH * 0.28 + ndcY * (oldFrustumH * 0.5);

    const clampedDelta = Math.max(-160, Math.min(160, deltaY));
    const zoomFactor = Math.exp(-clampedDelta * 0.0016);
    const newZoom = Math.max(
      this.minZoom,
      Math.min(this.maxZoom, oldZoom * zoomFactor)
    );

    const newFrustumH = this.baseFrustumH / newZoom;
    const newFrustumW = newFrustumH * aspect;

    // Adjust targetPan so focalWorldX/Y remains stationary under the cursor
    this.targetZoom = newZoom;
    this.targetPanX = focalWorldX - ndcX * (newFrustumW * 0.5);
    this.targetPanY =
      focalWorldY - newFrustumH * 0.28 - ndcY * (newFrustumH * 0.5);

    return this.targetZoom;
  }

  setZoom(newZoom, focalWorldX = null, focalWorldY = null) {
    const clamped = Math.max(this.minZoom, Math.min(this.maxZoom, newZoom));
    const oldFrustumH = this.baseFrustumH / this.targetZoom;
    const newFrustumH = this.baseFrustumH / clamped;

    if (focalWorldX !== null && focalWorldY !== null) {
      this.targetPanX = focalWorldX;
      this.targetPanY = focalWorldY - newFrustumH * 0.28;
    } else {
      // Preserve current viewport vertical center when zooming via UI buttons
      const currentCenterY = this.targetPanY + oldFrustumH * 0.28;
      this.targetPanY = currentCenterY - newFrustumH * 0.28;
    }

    this.targetZoom = clamped;
    return this.targetZoom;
  }

  zoomIn(step = 1.22) {
    return this.setZoom(this.targetZoom * step);
  }

  zoomOut(step = 1.22) {
    return this.setZoom(this.targetZoom / step);
  }

  panByScreenDelta(dxPx, dyPx, viewW, viewH) {
    const safeW = Math.max(1, viewW || window.innerWidth || 1024);
    const safeH = Math.max(1, viewH || window.innerHeight || 768);
    const aspect = safeW / safeH;

    const frustumH = this.baseFrustumH / Math.max(0.05, this.zoom);
    const frustumW = frustumH * aspect;

    const worldPerPxX = frustumW / safeW;
    const worldPerPxY = frustumH / safeH;

    this.panX -= dxPx * worldPerPxX;
    this.panY += dyPx * worldPerPxY;
    this.targetPanX = this.panX;
    this.targetPanY = this.panY;

    this.updateProjection(safeW, safeH);
  }

  pan(dxPx, dyPx, viewW, viewH) {
    this.panByScreenDelta(dxPx, dyPx, viewW, viewH);
  }

  autoFit(bboxOrBonsai, viewW, viewH, immediate = false) {
    if (!bboxOrBonsai) return this.targetZoom;
    const bbox =
      typeof bboxOrBonsai.getBoundingBox === 'function'
        ? bboxOrBonsai.getBoundingBox()
        : bboxOrBonsai;

    if (!bbox) return this.targetZoom;

    const safeW = Math.max(1, viewW || window.innerWidth || 1024);
    const safeH = Math.max(1, viewH || window.innerHeight || 768);
    const aspect = safeW / safeH;

    const minX = bbox.minX !== undefined ? bbox.minX : -110;
    const maxX = bbox.maxX !== undefined ? bbox.maxX : 110;
    const minY = bbox.minY !== undefined ? bbox.minY : -55;
    const maxY = bbox.maxY !== undefined ? bbox.maxY : 160;

    const rawW = Math.max(120, bbox.width !== undefined ? bbox.width : maxX - minX);
    const rawH = Math.max(120, bbox.height !== undefined ? bbox.height : maxY - minY);

    // Add 18% margin around the tree + pot (plus extra vertical breathing room for top/bottom bars)
    const paddedW = rawW * 1.18;
    const paddedH = rawH * 1.24;

    const requiredFrustumH = Math.max(paddedH, paddedW / Math.max(0.2, aspect));
    const idealZoom = this.baseFrustumH / requiredFrustumH;
    const clampedZoom = Math.max(0.25, Math.min(2.2, idealZoom));

    const centerX =
      bbox.centerX !== undefined ? bbox.centerX : (minX + maxX) * 0.5;
    const centerY =
      bbox.centerY !== undefined ? bbox.centerY : (minY + maxY) * 0.5;

    const newFrustumH = this.baseFrustumH / clampedZoom;

    this.targetZoom = clampedZoom;
    this.targetPanX = centerX;
    this.targetPanY = centerY - newFrustumH * 0.28;

    if (immediate) {
      this.zoom = this.targetZoom;
      this.panX = this.targetPanX;
      this.panY = this.targetPanY;
      this.updateProjection(safeW, safeH);
    }

    return this.targetZoom;
  }

  autoFitBonsai(bonsai, viewW, viewH, immediate = false) {
    return this.autoFit(bonsai, viewW, viewH, immediate);
  }

  resetView(immediate = false, viewW = window.innerWidth, viewH = window.innerHeight) {
    this.targetZoom = 1.0;
    this.targetPanX = 0.0;
    this.targetPanY = 0.0;
    if (immediate) {
      this.zoom = 1.0;
      this.panX = 0.0;
      this.panY = 0.0;
      this.updateProjection(viewW, viewH);
    }
  }
}


/* --- MODULE: src/interaction/PruningController.js --- */
/* ====================================================================
   INTERACTIVE PRUNING, BUD PINCHING / DEFOLIATION & PAN/ZOOM CONTROLLER
   ==================================================================== */

function distToSegment2D(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const lenSq = dx * dx + dy * dy;
  if (lenSq < 0.001) return Math.hypot(px - x0, py - y0);
  const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / lenSq));
  return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
}

class PruningController {
  constructor(rendererOrOptions, cameraController, getBonsai, audio, callbacks = {}) {
    if (
      rendererOrOptions &&
      typeof rendererOrOptions === 'object' &&
      !rendererOrOptions.getDomElement &&
      !rendererOrOptions.domElement &&
      (rendererOrOptions.renderer || rendererOrOptions.cameraController)
    ) {
      this.renderer = rendererOrOptions.renderer;
      this.cameraController = rendererOrOptions.cameraController;
      this.getBonsai =
        typeof rendererOrOptions.getBonsai === 'function'
          ? rendererOrOptions.getBonsai
          : () => rendererOrOptions.bonsai;
      this.audio = rendererOrOptions.audio || null;
      this.onZoomChange = rendererOrOptions.onZoomChange || null;
      this.onAction = rendererOrOptions.onAction || null;
      this.onToolChange = rendererOrOptions.onToolChange || null;
    } else {
      this.renderer = rendererOrOptions;
      this.cameraController = cameraController;
      this.getBonsai =
        typeof getBonsai === 'function' ? getBonsai : () => getBonsai;
      this.audio = audio || null;
      this.onZoomChange = callbacks.onZoomChange || null;
      this.onAction = callbacks.onAction || null;
      this.onToolChange = callbacks.onToolChange || null;
    }

    this.domElement =
      this.renderer && typeof this.renderer.getDomElement === 'function'
        ? this.renderer.getDomElement()
        : this.renderer && this.renderer.domElement
        ? this.renderer.domElement
        : null;

    this.activeTool = 'PRUNE'; // 'PRUNE' | 'PINCH' | 'PAN'
    this.hoveredSegId = null;
    this.hoveredBudId = null;
    this.hoveredLeafId = null;
    this.hoveredDescSet = new Set();

    this.isSpaceDown = false;
    this.isPointerDown = false;
    this.isPanning = false;
    this.dragDistPx = 0;
    this.lastClientX = 0;
    this.lastClientY = 0;

    if (this.domElement) {
      this.bindEvents();
      this.updateCursorClass();
    }
  }

  setTool(tool) {
    this.activeTool = tool;
    this.clearHover();
    this.updateCursorClass();
    if (typeof this.onToolChange === 'function') {
      this.onToolChange(tool);
    }
  }

  clearHover() {
    this.hoveredSegId = null;
    this.hoveredBudId = null;
    this.hoveredLeafId = null;
    this.hoveredDescSet.clear();
  }

  getInteractionState(seasonTheme = 'SPRING') {
    return {
      hoveredSegId: this.hoveredSegId,
      hoveredBudId: this.hoveredBudId,
      hoveredLeafId: this.hoveredLeafId,
      hoveredDescSet: this.hoveredDescSet,
      activeTool: this.activeTool,
      seasonTheme
    };
  }

  updateCursorClass() {
    if (!this.domElement) return;
    this.domElement.classList.remove(
      'canvas-prune',
      'canvas-pinch',
      'canvas-pan',
      'canvas-panning'
    );
    if (this.isPanning) {
      this.domElement.classList.add('canvas-panning');
    } else if (this.isSpaceDown || this.activeTool === 'PAN') {
      this.domElement.classList.add('canvas-pan');
    } else if (this.activeTool === 'PINCH') {
      this.domElement.classList.add('canvas-pinch');
    } else {
      this.domElement.classList.add('canvas-prune');
    }
  }

  bindEvents() {
    const el = this.domElement;

    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        this.isSpaceDown = true;
        this.updateCursorClass();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        this.isSpaceDown = false;
        this.updateCursorClass();
      }
    });

    el.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        if (!this.cameraController) return;
        this.cameraController.zoomByWheel(e.deltaY, e.clientX, e.clientY, el);
        this.updateHover(e.clientX, e.clientY);
        if (typeof this.onZoomChange === 'function') {
          this.onZoomChange(this.cameraController.targetZoom);
        }
      },
      { passive: false }
    );

    el.addEventListener('mousedown', (e) => {
      if (this.audio) this.audio.init();
      this.isPointerDown = true;
      this.dragDistPx = 0;
      this.lastClientX = e.clientX;
      this.lastClientY = e.clientY;

      this.updateHover(e.clientX, e.clientY);
      const nothingHovered =
        !this.hoveredSegId && !this.hoveredBudId && !this.hoveredLeafId;

      if (
        this.activeTool === 'PAN' ||
        this.isSpaceDown ||
        e.button === 1 ||
        e.button === 2 ||
        (e.button === 0 && nothingHovered)
      ) {
        this.isPanning = true;
        this.updateCursorClass();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (this.isPointerDown) {
        const dx = e.clientX - this.lastClientX;
        const dy = e.clientY - this.lastClientY;
        this.lastClientX = e.clientX;
        this.lastClientY = e.clientY;
        this.dragDistPx += Math.hypot(dx, dy);

        if (!this.isPanning && this.dragDistPx > 6) {
          this.isPanning = true;
          this.clearHover();
          this.updateCursorClass();
        }

        if (this.isPanning && this.cameraController) {
          this.cameraController.panByScreenDelta(
            dx,
            dy,
            el.clientWidth || window.innerWidth,
            el.clientHeight || window.innerHeight
          );
          return;
        }
      }

      if (e.target === el) {
        this.updateHover(e.clientX, e.clientY);
      } else {
        this.clearHover();
      }
    });

    window.addEventListener('mouseup', () => {
      this.isPointerDown = false;
      if (this.isPanning) {
        this.isPanning = false;
        this.updateCursorClass();
      }
    });

    el.addEventListener('mouseleave', () => {
      if (!this.isPointerDown) {
        this.clearHover();
      }
    });

    el.addEventListener('click', (e) => {
      if (this.dragDistPx > 6) return;
      if (this.activeTool === 'PAN' || this.isSpaceDown) return;

      if (this.audio) this.audio.init();
      const bonsai = this.getBonsai();
      if (!bonsai) return;

      this.updateHover(e.clientX, e.clientY);

      if (this.activeTool === 'PRUNE') {
        if (this.hoveredSegId && bonsai.pruneSegment(this.hoveredSegId)) {
          if (this.audio) this.audio.playSnip();
          this.clearHover();
          if (typeof this.onAction === 'function') this.onAction('PRUNE');
        }
      } else if (this.activeTool === 'PINCH') {
        const targetId =
          this.hoveredBudId || this.hoveredLeafId || this.hoveredSegId;
        if (!targetId) return;

        let acted = bonsai.pinchOrWakeBud(targetId);
        if (!acted && this.hoveredSegId && targetId !== this.hoveredSegId) {
          acted = bonsai.pinchOrWakeBud(this.hoveredSegId);
        }
        if (acted) {
          if (this.audio) this.audio.playBudPop();
          this.clearHover();
          if (typeof this.onAction === 'function') this.onAction('PINCH');
        }
      }
    });
  }

  updateHover(clientX, clientY) {
    this.clearHover();
    if (this.activeTool === 'PAN' || this.isSpaceDown || this.isPanning) {
      return;
    }

    const bonsai = this.getBonsai();
    if (!bonsai || !this.cameraController || !this.domElement) return;

    const { worldX, worldY } = this.cameraController.screenToWorld(
      clientX,
      clientY,
      this.domElement
    );
    const zoomScale = Math.max(0.35, Math.min(3.5, this.cameraController.zoom));
    const rootSegId =
      bonsai.segments && bonsai.segments.length > 0
        ? bonsai.segments[0].id
        : null;

    if (this.activeTool === 'PRUNE') {
      // Find closest pruneable segment (any INTERNODE or thickened branch/trunk above segments[0])
      let bestSeg = null;
      let bestScore = Infinity;
      const baseTol = 15.0 / zoomScale;

      for (const seg of bonsai.segments) {
        if (seg.pruned || seg.id === rootSegId || seg.parentId === null) {
          continue;
        }
        const curX1 = seg.x0 + (seg.x1 - seg.x0) * seg.curT;
        const curY1 = seg.y0 + (seg.y1 - seg.y0) * seg.curT;
        const d = distToSegment2D(worldX, worldY, seg.x0, seg.y0, curX1, curY1);
        const segTol = Math.max(baseTol, (seg.r0 || 2.0) * 1.15);

        if (d < segTol) {
          // Slight preference for internodes over primary trunk heads when overlapping
          const penalty = seg.type === 'TRUNK_HEAD' ? 2.5 : 0.0;
          const score = d + penalty;
          if (score < bestScore) {
            bestScore = score;
            bestSeg = seg;
          }
        }
      }

      if (bestSeg) {
        this.hoveredSegId = bestSeg.id;
        const list = [];
        bonsai.collectDescendants(bestSeg.id, list);
        for (const id of list) {
          this.hoveredDescSet.add(id);
        }
      }
      return;
    }

    if (this.activeTool === 'PINCH') {
      // 1. Check closest dormant or swelling bud (including AXILLARY_LEAF_BUD)
      let bestBud = null;
      let minBudDist = 11.5 / zoomScale;

      for (const bud of bonsai.buds) {
        if (bud.pruned || bud.state === 'SPENT') continue;
        const pSeg = bonsai.SegmentMap.get(bud.parentSegId);
        if (!pSeg || pSeg.pruned) continue;

        const d = Math.hypot(worldX - bud.x, worldY - bud.y);
        if (d < minBudDist) {
          minBudDist = d;
          bestBud = bud;
        }
      }

      if (bestBud) {
        this.hoveredBudId = bestBud.id;
        this.hoveredSegId = bestBud.parentSegId;
        return;
      }

      // 2. Check closest leaf for Mekiri defoliation (waking its axillary bud!)
      let bestLeaf = null;
      let minLeafDist = 13.5 / zoomScale;

      for (const lf of bonsai.leaves) {
        if (lf.pruned) continue;
        const pSeg = bonsai.SegmentMap.get(lf.parentSegId);
        if (!pSeg || pSeg.pruned) continue;

        const curPetiole = (lf.petioleLen || 10) * (0.3 + 0.7 * (lf.age || 1));
        const bladeX = lf.x + Math.sin(lf.angle || 0) * curPetiole;
        const bladeY =
          lf.y + Math.cos(lf.angle || 0) * curPetiole - 2.0 * (lf.age || 1);

        const dBlade = Math.hypot(worldX - bladeX, worldY - bladeY);
        const dBase = Math.hypot(worldX - lf.x, worldY - lf.y);
        const d = Math.min(dBlade, dBase);
        const tol = Math.max(
          minLeafDist,
          (lf.maxRadius || 16) * (0.25 + 0.35 * (lf.age || 1))
        );

        if (d < tol && d < minLeafDist * 1.45) {
          minLeafDist = d;
          bestLeaf = lf;
        }
      }

      if (bestLeaf) {
        this.hoveredLeafId = bestLeaf.id;
        this.hoveredSegId = bestLeaf.parentSegId;
        return;
      }

      // 3. Check closest segment tip / node
      let bestSeg = null;
      let minSegDist = 14.0 / zoomScale;
      for (const seg of bonsai.segments) {
        if (seg.pruned) continue;
        const curX1 = seg.x0 + (seg.x1 - seg.x0) * seg.curT;
        const curY1 = seg.y0 + (seg.y1 - seg.y0) * seg.curT;
        const d = distToSegment2D(worldX, worldY, seg.x0, seg.y0, curX1, curY1);
        if (d < minSegDist) {
          minSegDist = d;
          bestSeg = seg;
        }
      }

      if (bestSeg) {
        this.hoveredSegId = bestSeg.id;
      }
    }
  }
}


/* --- MODULE: src/main.js --- */
/* ====================================================================
   MAIN ORCHESTRATOR: DIGITAL BONSAI PROCEDURAL BIO-SIMULATOR
   ==================================================================== */

const container = document.getElementById('canvasContainer');
const bonsaiAudio = new BonsaiAudioSynth();

let currentSeed = 0x84A3F2;
let currentSpecies = 'BONSAI_MAPLE'; // Strict focus on Acer palmatum (Arce Japonés // Yamamomiji)
let currentStartMode = 'SEEDLING_SHOOT'; // 'SEEDLING_SHOOT' | 'TRAINED_TRUNK'
let simSpeed = 1.0;
let autoFitFollow = true; // Auto-frame when tree outgrows viewport at high speed

// 1. Initialize Renderer & Camera Controller
const asciiRenderer = new AsciiThreeRenderer(container);
const cameraController = new CameraController(asciiRenderer.getCamera());

// 2. Create Living Bonsai Organism
let bonsai = null;

function createSpecimen(seed, species = 'BONSAI_MAPLE', startMode = 'SEEDLING_SHOOT', initialAutoFit = true) {
  currentSpecies = 'BONSAI_MAPLE';
  bonsai = new LivingBonsaiOrganism(seed, currentSpecies, startMode);

  if (startMode === 'SEEDLING_SHOOT') {
    // Advance slightly so the young shoot displays its first tender leaves & axillary leaf-buds
    for (let i = 0; i < 18; i++) {
      bonsai.stepBiology(0.05);
    }
  }

  updateSpecimenHeaderUI();

  if (initialAutoFit) {
    const bbox =
      typeof bonsai.getBoundingBox === 'function'
        ? bonsai.getBoundingBox()
        : null;
    if (bbox) {
      cameraController.autoFit(
        bbox,
        window.innerWidth,
        window.innerHeight,
        true
      );
      updateZoomLabelUI(cameraController.zoom);
    }
  }
}

// 3. Initialize Interactive Pruning, Bud Pinching & Pan/Zoom Controller
const pruningController = new PruningController({
  renderer: asciiRenderer,
  cameraController,
  getBonsai: () => bonsai,
  audio: bonsaiAudio,
  onZoomChange: (newTargetZoom) => {
    updateZoomLabelUI(newTargetZoom);
  },
  onToolChange: (tool) => {
    updateToolButtonsUI(tool);
  }
});

// 4. UI Helper Functions
function updateZoomLabelUI(zoomVal) {
  const el = document.getElementById('zoomLabel');
  if (el) {
    el.innerText = `${Math.round(zoomVal * 100)}%`;
  }
}

function updateToolButtonsUI(activeTool) {
  const toolPrune = document.getElementById('toolPrune');
  const toolPinch = document.getElementById('toolPinch');
  const toolPan = document.getElementById('toolPan');

  if (toolPrune) toolPrune.classList.toggle('active', activeTool === 'PRUNE');
  if (toolPinch) toolPinch.classList.toggle('active', activeTool === 'PINCH');
  if (toolPan) toolPan.classList.toggle('active', activeTool === 'PAN');
}

function updateStartModeButtonsUI() {
  const btnSeedling = document.getElementById('btnStartSeedling');
  const btnTrained = document.getElementById('btnStartTrained');

  if (btnSeedling) {
    btnSeedling.classList.toggle('active', currentStartMode === 'SEEDLING_SHOOT');
  }
  if (btnTrained) {
    btnTrained.classList.toggle('active', currentStartMode === 'TRAINED_TRUNK');
  }
}

function updateSpecimenHeaderUI() {
  const seedEl = document.getElementById('seedDisplay');
  if (seedEl) {
    seedEl.innerText = '0x' + (currentSeed >>> 0).toString(16).toUpperCase().padStart(6, '0');
  }

  const headerEl = document.getElementById('specimenHeader');
  if (headerEl) {
    const idNum = (currentSeed % 900) + 100;
    headerEl.innerText = `🍁 ACER_PALMATUM #${idNum}`;
  }

  const modeBadgeEl = document.getElementById('modeBadge');
  if (modeBadgeEl) {
    modeBadgeEl.innerText =
      currentStartMode === 'SEEDLING_SHOOT'
        ? '🌱 BROTE JOVEN'
        : '🪵 PRE-BONSÁI';
  }
}

/**
 * Normalizes season and calendar info from the bonsai organism or internal phenological calendar.
 */
function getBonsaiSeasonInfo(bonsaiInstance) {
  if (bonsaiInstance && typeof bonsaiInstance.getSeasonInfo === 'function') {
    const info = bonsaiInstance.getSeasonInfo();
    if (info && info.seasonName && info.seasonIcon) {
      return info;
    }
  }

  const simDays = bonsaiInstance?.simDays || 0;
  const baseYear = currentStartMode === 'SEEDLING_SHOOT' ? 1 : 3;
  const year = Math.max(1, Math.floor(simDays / 360) + baseYear);
  const dayInYear = Math.floor(((simDays % 360) + 360) % 360);
  const seasonIndex = Math.floor(dayInYear / 90) % 4; // 0: Spring, 1: Summer, 2: Autumn, 3: Winter

  const seasonNames = ['PRIMAVERA', 'VERANO', 'OTOÑO', 'INVIERNO'];
  const seasonIcons = ['🌸', '☀️', '🍁', '❄️'];
  const monthNames = [
    '3月 MAR', '4月 ABR', '5月 MAY',   // Spring (Days 0-89)
    '6月 JUN', '7月 JUL', '8月 AGO',   // Summer (Days 90-179)
    '9月 SEP', '10月 OCT', '11月 NOV', // Autumn (Days 180-269)
    '12月 DIC', '1月 ENE', '2月 FEB'   // Winter (Days 270-359)
  ];
  const monthIndex = Math.floor(dayInYear / 30) % 12;
  const progressInSeason = (dayInYear % 90) / 90;

  return {
    year,
    seasonIndex,
    seasonName: seasonNames[seasonIndex],
    seasonIcon: seasonIcons[seasonIndex],
    monthIndex,
    monthName: monthNames[monthIndex],
    dayInYear,
    progressInSeason,
    isWinter: seasonIndex === 3
  };
}

/**
 * Updates the visual styling and badge for the 4 seasons.
 */
function updateSeasonBadge(seasonInfo) {
  const badgeEl = document.getElementById('hudSeasonBadge');
  if (!badgeEl) return;

  const name = seasonInfo.seasonName || 'PRIMAVERA';
  const icon = seasonInfo.seasonIcon || '🌸';
  badgeEl.innerText = `${icon} ${name}`;

  if (name === 'PRIMAVERA') {
    badgeEl.className = 'px-2 py-0.5 rounded font-bold bg-[#281523] border border-[#f472b6] text-[#f472b6] shadow-[0_0_8px_rgba(244,114,182,0.3)] transition-all duration-300';
  } else if (name === 'VERANO') {
    badgeEl.className = 'px-2 py-0.5 rounded font-bold bg-[#0c2415] border border-[#4ade80] text-[#4ade80] shadow-[0_0_8px_rgba(74,222,128,0.3)] transition-all duration-300';
  } else if (name === 'OTOÑO') {
    badgeEl.className = 'px-2 py-0.5 rounded font-bold bg-[#2a1306] border border-[#fb923c] text-[#fb923c] shadow-[0_0_8px_rgba(251,146,60,0.35)] transition-all duration-300';
  } else if (name === 'INVIERNO') {
    badgeEl.className = 'px-2 py-0.5 rounded font-bold bg-[#091e30] border border-[#38bdf8] text-[#38bdf8] shadow-[0_0_8px_rgba(56,189,248,0.3)] transition-all duration-300';
  }
}

function setSimSpeed(spd) {
  simSpeed = Math.max(0, Math.min(25, Number(spd) || 0));

  const slider = document.getElementById('speedSlider');
  if (slider && Math.abs(Number(slider.value) - simSpeed) > 0.01) {
    slider.value = String(simSpeed);
  }

  const label = document.getElementById('speedValueLabel');
  if (label) {
    if (simSpeed === 0) {
      label.innerText = '0.0x (PAUSA)';
    } else if (Math.abs(simSpeed - 1.0) < 0.05) {
      label.innerText = '1.0x ZEN';
    } else {
      label.innerText = `${simSpeed.toFixed(1)}x`;
    }
  }

  const speedButtons = [
    { id: 'btnSpeedPause', val: 0 },
    { id: 'btnSpeed1x', val: 1 },
    { id: 'btnSpeed4x', val: 4 },
    { id: 'btnSpeed12x', val: 12 },
    { id: 'btnSpeed25x', val: 25 }
  ];

  for (const btnCfg of speedButtons) {
    const btn = document.getElementById(btnCfg.id);
    if (btn) {
      btn.classList.toggle('active', Math.abs(simSpeed - btnCfg.val) < 0.05);
    }
  }

  const liveDot = document.getElementById('liveDot');
  if (liveDot) {
    liveDot.className =
      simSpeed === 0
        ? 'inline-block w-2 h-2 rounded-full bg-amber-400'
        : 'inline-block w-2 h-2 rounded-full bg-[#37ecc4] animate-pulse';
  }
}

function updateTelemetryHUD(renderStats) {
  if (!bonsai) return;

  const seasonInfo = getBonsaiSeasonInfo(bonsai);
  updateSeasonBadge(seasonInfo);

  const elYear = document.getElementById('hudYearBadge');
  if (elYear) {
    elYear.innerText = `AÑO ${seasonInfo.year}`;
  }

  const elMonth = document.getElementById('hudMonthBadge');
  if (elMonth) {
    elMonth.innerText = seasonInfo.monthName;
  }

  let activeBuds = renderStats?.activeBudCount;
  let activeLeaves = renderStats?.activeLeafCount;
  let activeBranches = renderStats?.activeBranchCount;
  let trunkCaliberMm = renderStats?.trunkCaliberMm;

  if (activeBuds === undefined) {
    activeBuds = bonsai.buds.filter(
      (b) => !b.pruned && (b.state === 'SWELLING' || b.state === 'DORMANT')
    ).length;
  }
  if (activeLeaves === undefined) {
    activeLeaves = bonsai.leaves.filter((l) => !l.pruned).length;
  }
  if (activeBranches === undefined) {
    activeBranches = bonsai.segments.filter((s) => !s.pruned).length;
  }

  let maxGen = 0;
  for (const s of bonsai.segments) {
    if (!s.pruned && s.generation > maxGen) {
      maxGen = s.generation;
    }
  }

  const baseTrunk = bonsai.segments[0];
  if (trunkCaliberMm === undefined && baseTrunk) {
    trunkCaliberMm = (baseTrunk.r0 * 1.45).toFixed(1);
  }

  const elBuds = document.getElementById('hudBuds');
  const elLeaves = document.getElementById('hudLeaves');
  const elBranches = document.getElementById('hudBranches');
  const elOrder = document.getElementById('hudOrder');
  const elCaliber = document.getElementById('trunkCaliberLabel');
  const elAge = document.getElementById('simAgeLabel');

  if (elBuds) elBuds.innerText = `${activeBuds}`;
  if (elLeaves) elLeaves.innerText = `${activeLeaves}`;
  if (elBranches) elBranches.innerText = `${activeBranches}`;
  if (elOrder) elOrder.innerText = `G${maxGen}`;
  if (elCaliber && trunkCaliberMm !== undefined) {
    elCaliber.innerText =
      typeof trunkCaliberMm === 'number'
        ? `${trunkCaliberMm.toFixed(1)} mm`
        : `${trunkCaliberMm}`.includes('mm')
        ? `${trunkCaliberMm}`
        : `${trunkCaliberMm} mm`;
  }

  if (elAge) {
    elAge.innerText = `AÑO ${seasonInfo.year} // ${seasonInfo.seasonIcon} ${seasonInfo.seasonName} (${seasonInfo.monthName})`;
  }
}

function advanceSeasonAction() {
  if (!bonsai) return;
  bonsaiAudio.playSeasonChime();

  if (typeof bonsai.advanceSeason === 'function') {
    bonsai.advanceSeason();
  } else if (typeof bonsai.burstSpringFlush === 'function') {
    bonsai.burstSpringFlush();
  } else {
    const currentDays = bonsai.simDays || 0;
    const remainder = ((currentDays % 90) + 90) % 90;
    const toNextBoundary = remainder < 5 ? 90 : 90 - remainder;
    bonsai.stepBiology(toNextBoundary / 4.5);
  }

  if (autoFitFollow && typeof bonsai.getBoundingBox === 'function') {
    cameraController.autoFit(
      bonsai.getBoundingBox(),
      window.innerWidth,
      window.innerHeight,
      false
    );
    updateZoomLabelUI(cameraController.targetZoom);
  }

  updateTelemetryHUD();
}

// 5. Wire Up DOM Event Listeners
function bindUIControls() {
  // Tools
  document.getElementById('toolPrune')?.addEventListener('click', () => {
    pruningController.setTool('PRUNE');
  });
  document.getElementById('toolPinch')?.addEventListener('click', () => {
    pruningController.setTool('PINCH');
  });
  document.getElementById('toolPan')?.addEventListener('click', () => {
    pruningController.setTool('PAN');
  });

  document.getElementById('btnUndo')?.addEventListener('click', () => {
    if (bonsai && bonsai.undo()) {
      bonsaiAudio.playBudPop();
    }
  });

  document.getElementById('btnSoundToggle')?.addEventListener('click', (e) => {
    bonsaiAudio.enabled = !bonsaiAudio.enabled;
    e.currentTarget.innerText = bonsaiAudio.enabled ? '🔊' : '🔇';
  });

  // Speed presets + Slider + Advance Season
  document.getElementById('btnSpeedPause')?.addEventListener('click', () => setSimSpeed(0));
  document.getElementById('btnSpeed1x')?.addEventListener('click', () => setSimSpeed(1));
  document.getElementById('btnSpeed4x')?.addEventListener('click', () => setSimSpeed(4));
  document.getElementById('btnSpeed12x')?.addEventListener('click', () => setSimSpeed(12));
  document.getElementById('btnSpeed25x')?.addEventListener('click', () => setSimSpeed(25));

  document.getElementById('speedSlider')?.addEventListener('input', (e) => {
    setSimSpeed(parseFloat(e.target.value));
  });

  document.getElementById('btnAdvanceSeason')?.addEventListener('click', advanceSeasonAction);
  document.getElementById('btnHeaderAdvanceSeason')?.addEventListener('click', advanceSeasonAction);

  // Zoom & Framing Controls
  document.getElementById('btnZoomOut')?.addEventListener('click', () => {
    const z = cameraController.zoomOut(1.22);
    updateZoomLabelUI(z);
  });

  document.getElementById('btnZoomIn')?.addEventListener('click', () => {
    const z = cameraController.zoomIn(1.22);
    updateZoomLabelUI(z);
  });

  document.getElementById('zoomLabel')?.addEventListener('click', () => {
    const z = cameraController.setZoom(1.0);
    updateZoomLabelUI(z);
  });

  document.getElementById('btnAutoFit')?.addEventListener('click', () => {
    if (!bonsai || typeof bonsai.getBoundingBox !== 'function') return;
    const z = cameraController.autoFit(
      bonsai.getBoundingBox(),
      window.innerWidth,
      window.innerHeight,
      false
    );
    updateZoomLabelUI(z);
  });

  const btnAutoFitLock = document.getElementById('btnAutoFitLock');
  if (btnAutoFitLock) {
    btnAutoFitLock.classList.toggle('active', autoFitFollow);
    btnAutoFitLock.addEventListener('click', () => {
      autoFitFollow = !autoFitFollow;
      btnAutoFitLock.classList.toggle('active', autoFitFollow);
      if (autoFitFollow && bonsai && typeof bonsai.getBoundingBox === 'function') {
        const z = cameraController.autoFit(
          bonsai.getBoundingBox(),
          window.innerWidth,
          window.innerHeight,
          false
        );
        updateZoomLabelUI(z);
      }
    });
  }

  // Growth Origin Mode Controls ('SEEDLING_SHOOT' vs 'TRAINED_TRUNK')
  document.getElementById('btnStartSeedling')?.addEventListener('click', () => {
    currentStartMode = 'SEEDLING_SHOOT';
    updateStartModeButtonsUI();
    bonsaiAudio.playBudPop();
    createSpecimen(currentSeed, currentSpecies, currentStartMode, true);
  });

  document.getElementById('btnStartTrained')?.addEventListener('click', () => {
    currentStartMode = 'TRAINED_TRUNK';
    updateStartModeButtonsUI();
    bonsaiAudio.playBudPop();
    createSpecimen(currentSeed, currentSpecies, currentStartMode, true);
  });

  // Seed Mutation (Species is locked to Acer palmatum)
  document.getElementById('btnMutate')?.addEventListener('click', () => {
    currentSeed = Math.floor(Math.random() * 0xffffff) || 0x84a3f2;
    bonsaiAudio.playSeasonChime();
    createSpecimen(currentSeed, currentSpecies, currentStartMode, true);
  });

  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    cameraController.updateProjection(w, h);
    asciiRenderer.resize(w, h, cameraController);
  });
}

// 6. Initialize Specimen, UI & Animation Loop
createSpecimen(currentSeed, currentSpecies, currentStartMode, true);
bindUIControls();
updateStartModeButtonsUI();
updateToolButtonsUI(pruningController.activeTool);
setSimSpeed(1.0);

let lastTime = performance.now();
let autoFitTimer = 0;

function animate(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
  lastTime = now;

  if (bonsai && simSpeed > 0) {
    bonsai.stepBiology(dt * simSpeed * ZEN_SPEED_SCALE);

    // When autoFitFollow is active and running at fast speed, gently keep growing tree framed
    autoFitTimer += dt * Math.min(6, simSpeed);
    if (
      autoFitFollow &&
      !pruningController.isPanning &&
      autoFitTimer > 1.2 &&
      typeof bonsai.getBoundingBox === 'function'
    ) {
      autoFitTimer = 0;
      cameraController.autoFit(
        bonsai.getBoundingBox(),
        window.innerWidth,
        window.innerHeight,
        false
      );
    }
  }

  const currentZoom = cameraController.update(
    dt,
    window.innerWidth,
    window.innerHeight
  );
  updateZoomLabelUI(currentZoom);

  if (typeof asciiRenderer.setCellScale === 'function') {
    asciiRenderer.setCellScale(currentZoom);
  }

  const seasonInfo = getBonsaiSeasonInfo(bonsai);
  const theme =
    seasonInfo.seasonName === 'OTOÑO'
      ? 'AUTUMN'
      : seasonInfo.seasonName === 'INVIERNO'
      ? 'WINTER'
      : seasonInfo.seasonName === 'VERANO'
      ? 'SUMMER'
      : 'SPRING';

  const interactionState = {
    ...pruningController.getInteractionState(theme),
    seasonInfo,
    seasonTheme: theme
  };

  const renderStats = asciiRenderer.syncBiology(
    bonsai,
    now * 0.001,
    interactionState
  );

  updateTelemetryHUD(renderStats);
  asciiRenderer.render();

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


  </script>
</body>
