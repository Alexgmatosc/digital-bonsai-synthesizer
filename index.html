<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Specimen // Bonsai Zen Bio-Simulator (ASCII Hi-Res)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #020305;
      color: #9cdbfa;
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle CRT Scanlines and vignette */
    .crt-overlay {
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 58%, rgba(1, 3, 8, 0.85) 100%),
                  linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 100%, 100% 3px;
    }

    .glow-cyan {
      text-shadow: 0 0 8px rgba(55, 236, 196, 0.7), 0 0 18px rgba(52, 192, 237, 0.4);
    }

    /* Custom range slider styling */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(25, 45, 62, 0.7);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 2px;
      background: #37ecc4;
      box-shadow: 0 0 8px #37ecc4;
      cursor: pointer;
    }

    .cyber-panel {
      background: rgba(5, 13, 21, 0.75);
      border: 1px solid rgba(30, 68, 94, 0.65);
      backdrop-filter: blur(6px);
    }

    .tool-btn {
      transition: all 0.15s ease-in-out;
      cursor: pointer;
    }
    .tool-btn.active {
      background: rgba(55, 236, 196, 0.22) !important;
      border-color: #37ecc4 !important;
      color: #e1f5fe !important;
      box-shadow: 0 0 10px rgba(55, 236, 196, 0.35);
    }
    .canvas-prune {
      cursor: crosshair !important;
    }
    .canvas-pinch {
      cursor: cell !important;
    }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between p-2.5 md:p-4 overflow-hidden bg-[#020305]">

    </div>

    <!-- Right Pill: Compact Bio-Metrics -->

  <!-- BOTTOM CONTROL DOCK: Pruning Tools, Growth Scrubber & Seasonal Progression -->
  <footer class="relative z-20 cyber-panel px-3 py-2.5 rounded-lg max-w-6xl mx-auto w-full flex flex-col lg:flex-row items-center justify-between gap-2.5">
    
    <!-- Left: Bonsai Pruning & Cultivation Tools -->
    <div id="bonsaiToolsPanel" class="flex flex-wrap items-center gap-1.5 w-full lg:w-auto justify-center lg:justify-start">
      <button id="toolPrune" title="Cortar rama o entrenudo (deja muñón y activa 2 yemas laterales opuestas)" class="tool-btn active flex items-center gap-1.5 px-2.5 py-1.5 rounded text-[11px] font-mono bg-[#0b2130] border border-[#235370] text-[#8cecd5] hover:bg-[#123349]">

      <button id="toolPinch" title="Pinzar punta apical o defoliar hojas grandes (Mekiri / Ha-gari)" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded text-[11px] font-mono bg-[#0b2130] border border-[#235370] text-[#9bd6ff] hover:bg-[#123349]">

      <button id="btnAdvanceSeason" title="Avanzar ciclo de crecimiento: engrosa el tronco y brotan nuevas ramas dobles en los cortes" class="flex items-center gap-1.5 px-3 py-1.5 rounded text-[11px] font-bold font-mono bg-[#143a32] border border-[#37ecc4] text-[#37ecc4] hover:bg-[#1b4e43] active:scale-95 transition shadow">

      <button id="btnUndo" title="Deshacer último corte" class="px-2 py-1.5 rounded text-[11px] font-mono bg-[#091a27] border border-[#1b3d56] text-[#7ea0d6] hover:bg-[#11293c] active:scale-95 transition">
        ↺
      </button>

      <button id="btnSoundToggle" title="Activar/Silenciar audio Zen" class="px-2 py-1.5 rounded text-[11px] font-mono bg-[#091a27] border border-[#1b3d56] text-[#7ea0d6] hover:bg-[#11293c] active:scale-95 transition">

      </button>

    <!-- Center: Seasonal Growth Slider (3月 Mar -> 6月 Jun) -->
    <div class="flex items-center gap-2.5 w-full lg:w-5/12">
      <div class="flex items-center gap-1.5 whitespace-nowrap">
        <span id="syncBadge" class="w-2 h-2 rounded-full bg-[#37ecc4]"></span>
        <span class="text-[11px] text-[#71a5c7] font-bold">DESARROLLO:</span>
      </div>
      <input id="ageSlider" type="range" min="0.04" max="1.0" step="0.001" value="0.72" class="w-full cursor-pointer">
      <span id="ageDaysLabel" class="text-[11px] text-[#37ecc4] font-mono w-24 text-right">5月 (MAY)</span>
    </div>

    <!-- Right: Species & Seed Controls -->
    <div class="flex flex-wrap items-center justify-end gap-1.5 w-full lg:w-auto font-mono text-[11px]">
      <div class="flex items-center bg-[#081724] border border-[#1a3850] rounded px-2 py-1 gap-1.5">
        <select id="speciesSelect" class="bg-transparent text-[#37ecc4] font-bold outline-none cursor-pointer">
          <option value="BONSAI_MAPLE" selected class="bg-[#06121c]">🍁 Arce Japonés (Acer Palmatum)</option>
          <option value="BONSAI_ULMUS" class="bg-[#06121c]">🌳 Olmo Chino (Ulmus Parvifolia)</option>
          <option value="BONSAI_PINE" class="bg-[#06121c]">🌲 Pino Negro (Pinus Thunbergii)</option>
          <option value="BONSAI_JUNIPER" class="bg-[#06121c]">🌾 Enebro (Juniperus Chinensis)</option>
          <option value="MONSTERA" class="bg-[#06121c]">🌸 Flor Iris / Monstera ASCII</option>
        </select>
      </div>

      <button id="btnPlantNow" title="Reiniciar brotación de primavera (3月 Marzo)" class="px-2.5 py-1.5 bg-[#0b2230] hover:bg-[#13354a] border border-[#235370] text-[#9bd6ff] rounded transition active:scale-95">
        3月 MARZO
      </button>

      <button id="btnMutate" class="px-2.5 py-1.5 bg-[#102d3e] hover:bg-[#18445f] border border-[#30709f] text-[#50e3c2] rounded transition active:scale-95 font-bold flex items-center gap-1">
        <span>⟳</span> SEMILLA
      </button>

      <button id="btnTimeLapse" class="px-2.5 py-1.5 bg-[#092925] hover:bg-[#0e3f3a] border border-[#20695f] text-[#37ecc4] rounded transition active:scale-95 flex items-center gap-1">
        <span id="playIcon">▶</span> <span id="playText">CRECER</span>
      </button>
    </div>
  </footer>

  <script>
    /* ====================================================================
       ACER PALMATUM (JAPANESE MAPLE) & BONSAI BIO-SIMULATOR ENGINE
       ==================================================================== */

    const canvas = document.getElementById('bioCanvas');
    const ctx = canvas.getContext('2d');

    // UI References
    const ageSlider = document.getElementById('ageSlider');
    const ageDaysLabel = document.getElementById('ageDaysLabel');
    const syncBadge = document.getElementById('syncBadge');
    const speciesSelect = document.getElementById('speciesSelect');
    const btnMutate = document.getElementById('btnMutate');
    const btnPlantNow = document.getElementById('btnPlantNow');
    const btnTimeLapse = document.getElementById('btnTimeLapse');
    const btnWeatherSim = document.getElementById('btnWeatherSim');
    const weatherModeText = document.getElementById('weatherModeText');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    // HUD Elements
    const specimenHeader = document.getElementById('specimenHeader');
    const seedDisplay = document.getElementById('seedDisplay');
    const phaseLabel = document.getElementById('phaseLabel');
    const seasonBadge = document.getElementById('seasonBadge');
    const cityDisplay = document.getElementById('cityDisplay');
    const tempValue = document.getElementById('tempValue');
    const humValue = document.getElementById('humValue');
    const hudMetric1Label = document.getElementById('hudMetric1Label');
    const hudMetric2Label = document.getElementById('hudMetric2Label');
    const hudPetioles = document.getElementById('hudPetioles');
    const hudFenestration = document.getElementById('hudFenestration');

    let currentSeed = 0x84A3F2;
    let currentSpecies = 'BONSAI_MAPLE';
    let totalCycleDays = 30;
    let isTimeLapse = false;
    let growthProgress = 0.72; // Starts in lush late-spring canopy so user sees full maple leaves immediately
    let globalTick = 0;

    // Seasonal / Atmospheric state
    const environment = {
      tempC: 19.5,
      humidity: 68,
      isDay: true,
      metabolicFactor: 1.0,
      seasonTheme: 'SPRING_SUMMER' // 'SPRING_SUMMER' | 'AUTUMN_MOMIJI'
    };

    btnWeatherSim.addEventListener('click', () => {
      if (environment.seasonTheme === 'SPRING_SUMMER') {
        environment.seasonTheme = 'AUTUMN_MOMIJI';
        environment.tempC = 12.4;
        environment.humidity = 58;
        weatherModeText.innerText = 'OTOÑO (MOMIJI)';
        tempValue.innerText = '12.4°C';
      } else {
        environment.seasonTheme = 'SPRING_SUMMER';
        environment.tempC = 19.5;
        environment.humidity = 68;
        weatherModeText.innerText = 'PRIMAVERA / VERANO';
        tempValue.innerText = '19.5°C';
      }
    });

    ageSlider.addEventListener('input', (e) => {
      if (isTimeLapse) toggleTimeLapse(false);
      growthProgress = parseFloat(e.target.value);
    });

    /* ====================================================================
       1. DETERMINISTIC PRNG & GEOMETRY UTILITIES
       ==================================================================== */

    function createPRNG(seed) {
      let s = (typeof seed === 'number' ? seed : 0x84A3F2) >>> 0;
      return function() {
        let t = s += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const CHARS_PETIOLE = ['|', '¦', '!', '1', 'i', ':', '/'];
    const CHARS_SHEATH = ['(', ')', '|', '¦', ':', ';', '!'];
    const CHARS_BARK = ['#', '%', '8', '0', '&', '=', '|', '¦', ':', ';'];
    const CHARS_BLADE_FILL = ['0', '1', '8', '6', '4', '9', '3', '7', '2', '5', '=', ':', '·', '+'];
    const CHARS_EDGE = ['/', '\\', '|', '(', ')', '_', '.'];

    function getGlyph(pool, hash) {
      const idx = Math.abs(Math.floor(hash)) % pool.length;
      return pool[idx];
    }

    function evalQuadBezier(p0x, p0y, cpx, cpy, p1x, p1y, t) {
      const invT = 1 - t;
      const x = invT * invT * p0x + 2 * invT * t * cpx + t * t * p1x;
      const y = invT * invT * p0y + 2 * invT * t * cpy + t * t * p1y;
      const dx = 2 * invT * (cpx - p0x) + 2 * t * (p1x - cpx);
      const dy = 2 * invT * (cpy - p0y) + 2 * t * (p1y - cpy);
      const angle = Math.atan2(dy, dx);
      return { x, y, angle };
    }

    function getBezierSubCurve(p0x, p0y, cpx, cpy, p1x, p1y, t) {
      if (t >= 0.999) return { p0x, p0y, cpx, cpy, p1x, p1y };
      const q0x = p0x + (cpx - p0x) * t;
      const q0y = p0y + (cpy - p0y) * t;
      const q1x = cpx + (p1x - cpx) * t;
      const q1y = cpy + (p1y - cpy) * t;
      const rx = q0x + (q1x - q0x) * t;
      const ry = q0y + (q1y - q0y) * t;
      return { p0x, p0y, cpx: q0x, cpy: q0y, p1x: rx, p1y: ry };
    }

    /* ====================================================================
       2. WEB AUDIO ZEN SYNTHESIZER
       ==================================================================== */
    class BonsaiAudioSynth {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSnip() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1600, now);
          filter.frequency.exponentialRampToValueAtTime(3400, now + 0.04);

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(2200, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.05);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }
      playChime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(740, now);
          osc.frequency.exponentialRampToValueAtTime(1108, now + 0.10);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.46);
        } catch (e) {}
      }
    }
    const bonsaiAudio = new BonsaiAudioSynth();

    /* ====================================================================
       3. AUTHENTIC BONSAI ARCHITECTURE:
          MUSCULAR CHOPPED TRUNK BASE + INTERNODAL SHOOTS + PALMATE LEAVES
       ====================================================================
       Matches the 5 Japanese Maple (Acer palmatum) reference photos:
       - Photo 2 (3月 Mar): Thick, muscular, multi-head woody base (Nebari +
         Tachiagari) with diagonal saw-chop scars sealed with grey cut-paste,
         sprouting slender young shoots with tiny bronze-red unfolding palmate leaves.
       - Photo 1 (3月 Mar): Long, slender shoots (whips) extending outward with
         opposite leaf pairs at regular internodes.
       - Photo 3 & 5 (6月 Jun): Branches are still slender, but the 5-lobed palmate
         maple leaves have expanded to full lush emerald size on long red petioles.
       - Photo 4 (Summer Prune): Cutting a shoot at any internode removes the outer
         whip, leaving a thickened green-woody stub capped with a fresh cut callus,
         which then bifurcates into 2 opposite shoots on the next growth flush!
    */

    const BONSAI_SPECIES_MODELS = {
      BONSAI_MAPLE: {
        code: 'BONSAI_MAPLE',
        botanicalName: 'ACER_PALMATUM',
        leafType: 'MAPLE_PALMATE',
        potColor: 'TERRACOTTA',
        oppositePhyllotaxy: true
      },
      BONSAI_ULMUS: {
        code: 'BONSAI_ULMUS',
        botanicalName: 'ULMUS_PARVIFOLIA',
        leafType: 'ELM_SERRATED',
        potColor: 'GLAZED_BLUE',
        oppositePhyllotaxy: false
      },
      BONSAI_PINE: {
        code: 'BONSAI_PINE',
        botanicalName: 'PINUS_THUNBERGII',
        leafType: 'PINE_NEEDLE',
        potColor: 'DARK_CLAY',
        oppositePhyllotaxy: false
      },
      BONSAI_JUNIPER: {
        code: 'BONSAI_JUNIPER',
        botanicalName: 'JUNIPERUS_CHINENSIS',
        leafType: 'JUNIPER_SCALE',
        potColor: 'TERRACOTTA',
        oppositePhyllotaxy: false
      }
    };

    // Falling clippings animation list when the user prunes a shoot or leaf
    let fallingClippings = [];

    class FractalBonsaiTree {
      constructor(seed, speciesKey = 'BONSAI_MAPLE') {
        this.seed = seed;
        this.speciesKey = speciesKey;
        this.spec = BONSAI_SPECIES_MODELS[speciesKey] || BONSAI_SPECIES_MODELS['BONSAI_MAPLE'];
        this.rng = createPRNG(seed);
        this.nodes = new Map();
        this.nebariRoots = [];
        this.fertilizerPellets = [];
        this.history = [];
        this.seasonCount = 1;
        this.nodeCounter = 1;
        this.buildAuthenticBonsai();
      }

      buildAuthenticBonsai() {
        this.nodes.clear();
        this.nebariRoots = [];
        this.fertilizerPellets = [];
        const rng = this.rng;

        // 1. Wide Muscular Nebari Surface Root Flare (gripping the soil like Photo 1, 2, 4)
        const numRoots = 7 + Math.floor(rng() * 3);
        for (let r = 0; r < numRoots; r++) {
          const frac = (r / (numRoots - 1)) * 2 - 1; // -1 to +1
          this.nebariRoots.push({
            dirX: frac * (42 + rng() * 18),
            dirY: 5 + Math.abs(frac) * 6 + rng() * 4,
            thickness: 12.5 - Math.abs(frac) * 4.5 + rng() * 2.0,
            hasPasteScar: (Math.abs(frac) < 0.35 && rng() < 0.45)
          });
        }

        // White/Cream Organic Fertilizer Cakes (Tamahi / Biogold) on the pot soil rim (Photos 1, 2, 3, 5)
        const pelletPositions = [-78, -52, -26, 48, 76];
        for (const px of pelletPositions) {
          this.fertilizerPellets.push({
            x: px + (rng() - 0.5) * 10,
            y: 1.5 + rng() * 3.5,
            rx: 8.5 + rng() * 2.5,
            ry: 4.2 + rng() * 1.2
          });
        }

        // 2. Heavy Chopped Trunk Base (Tachiagari + 3 to 4 Muscular Woody Stumps like Photo 2 & 4)
        const baseGirth = 30.0 + rng() * 5.0;
        const mainLean = (rng() - 0.5) * 10;

        // Lower fused trunk core
        const coreTrunk = {
          id: 'TRUNK_BASE',
          parentId: null,
          parentAttachT: 1.0,
          depth: 0,
          type: 'TRUNK',
          p0x: 0, p0y: 2,
          cpx: mainLean * 0.5, cpy: -18,
          p1x: mainLean, p1y: -36 - rng() * 8,
          baseGirth: baseGirth,
          currentGirth: baseGirth,
          endGirth: baseGirth * 0.78,
          woodiness: 1.0, // 1.0 = aged grey-taupe bark
          birthAge: 0.0,
          matureAge: 0.04,
          hasChopScar: true,
          scarStyle: 'DARK_PASTE', // Dark grey cut-paste seal on base like Photo 1 & 2
          scarOffsetX: 8,
          scarOffsetY: 12,
          pruned: false,
          leaves: [],
          childrenIds: []
        };
        this.nodes.set(coreTrunk.id, coreTrunk);

        // 3 to 4 Heavy Chopped Sub-Trunks (the thick woody pillars in Photos 1, 2, 4)
        const numHeads = 3 + (rng() > 0.45 ? 1 : 0);
        const headAngles = numHeads === 4
          ? [-0.58, -0.18, 0.16, 0.54]
          : [-0.48, -0.04, 0.44];

        for (let h = 0; h < numHeads; h++) {
          const hAngle = headAngles[h] + (rng() - 0.5) * 0.14;
          const isCenterHead = Math.abs(hAngle) < 0.25;
          const headLen = (isCenterHead ? 42 : 32) + rng() * 14;
          const attachX = coreTrunk.p1x + hAngle * 18;
          const attachY = coreTrunk.p1y + Math.abs(hAngle) * 10;

          const endX = attachX + Math.sin(hAngle) * headLen;
          const endY = attachY - Math.cos(hAngle) * headLen;
          const ctrlX = (attachX + endX) * 0.5 + Math.sin(hAngle) * 5;
          const ctrlY = (attachY + endY) * 0.5;

          const headGirth = (isCenterHead ? 13.5 : 10.5) + rng() * 2.5;

          const trunkHead = {
            id: `TRUNK_HEAD_${h}`,
            parentId: coreTrunk.id,
            parentAttachT: 0.85,
            depth: 0,
            type: 'TRUNK_HEAD',
            p0x: attachX, p0y: attachY,
            cpx: ctrlX, cpy: ctrlY,
            p1x: endX, p1y: endY,
            baseGirth: headGirth,
            currentGirth: headGirth,
            endGirth: headGirth * 0.82,
            woodiness: 0.95,
            birthAge: 0.0,
            matureAge: 0.05,
            hasChopScar: true, // Every trunk head ends in a flat/angled saw chop!
            scarStyle: h === 0 ? 'DARK_PASTE' : 'CALLUS_BEVEL',
            swingDir: hAngle >= 0 ? 1 : -1,
            pruned: false,
            leaves: [],
            childrenIds: []
          };
          this.nodes.set(trunkHead.id, trunkHead);
          coreTrunk.childrenIds.push(trunkHead.id);

          // From each chopped woody trunk head, sprout 2 to 3 slender shoots (like Photo 1 & 2!)
          const numShoots = 2 + (isCenterHead || rng() > 0.5 ? 1 : 0);
          for (let s = 0; s < numShoots; s++) {
            const shootOffsetAngle = (s - (numShoots - 1) * 0.5) * 0.48 + (rng() - 0.5) * 0.18;
            const shootDirAngle = -Math.PI / 2 + hAngle * 0.85 + shootOffsetAngle;
            const startT = 0.72 + s * 0.12;
            const hasWire = (h === numHeads - 1 && s === numShoots - 1); // Wired right branch like Photo 2!
            const shootStartBirth = 0.05 + (h * 0.02 + s * 0.03);

            this.buildInternodeChain({
              parentNode: trunkHead,
              attachT: Math.min(0.98, startT),
              dirAngle: shootDirAngle,
              numInternodes: 3 + Math.floor(rng() * 2), // 3 to 4 internodes per shoot
              startBirth: shootStartBirth,
              baseGirth: 2.2 + rng() * 0.7, // Slender shoot (contrast with thick trunk!)
              woodiness: 0.25, // Semi-woody green-brown at base, tender at tip
              hasWire,
              generation: 1
            });
          }
        }
      }

      /*
       * Builds a realistic chain of Internodes (entrenudos) along a growing shoot.
       * At the end of each internode sits a Node with opposite maple leaves (filotaxis opuesta).
       */
      buildInternodeChain(cfg) {
        const { parentNode, attachT, dirAngle, numInternodes, startBirth, baseGirth, woodiness, hasWire, generation } = cfg;
        const rng = this.rng;

        let curParent = parentNode;
        let curAttachT = attachT;
        let curAngle = dirAngle;
        let curBirth = startBirth;
        let curGirth = baseGirth;

        // Calculate starting world coordinate on parent
        const startPt = evalQuadBezier(
          parentNode.p0x, parentNode.p0y,
          parentNode.cpx, parentNode.cpy,
          parentNode.p1x, parentNode.p1y,
          attachT
        );
        let curX = startPt.x;
        let curY = startPt.y;

        for (let idx = 0; idx < numInternodes; idx++) {
          const internodeLen = (26 + rng() * 14) * Math.pow(0.88, generation - 1) * (1 - idx * 0.08);
          // Slight natural phototropic upward curve
          const bendAngle = curAngle + (rng() - 0.5) * 0.22 - (Math.cos(curAngle) * 0.08);
          const nextX = curX + Math.cos(bendAngle) * internodeLen;
          const nextY = curY + Math.sin(bendAngle) * internodeLen;
          const ctrlX = (curX + nextX) * 0.5 + (rng() - 0.5) * 4;
          const ctrlY = (curY + nextY) * 0.5 - 2;

          const duration = 0.11;
          const matureAge = Math.min(0.96, curBirth + duration);
          const nextGirth = Math.max(1.1, curGirth * 0.84);

          // Create Opposite Pair of Leaves at the end of this internode
          const leaves = this.createNodeLeaves(bendAngle, matureAge, idx, numInternodes, generation);

          const internode = {
            id: `INT_${this.nodeCounter++}`,
            parentId: curParent.id,
            parentAttachT: curAttachT,
            depth: generation,
            internodeIndex: idx,
            type: 'INTERNODE',
            isGreenShoot: true,
            p0x: curX, p0y: curY,
            cpx: ctrlX, cpy: ctrlY,
            p1x: nextX, p1y: nextY,
            dirAngle: bendAngle,
            length: internodeLen,
            baseGirth: curGirth,
            currentGirth: curGirth,
            endGirth: nextGirth,
            woodiness: Math.max(0.0, woodiness - idx * 0.12),
            hasWire: hasWire && idx <= 2,
            birthAge: curBirth,
            matureAge: matureAge,
            hasChopScar: false,
            scarStyle: null,
            pruned: false,
            leaves,
            childrenIds: []
          };

          this.nodes.set(internode.id, internode);
          curParent.childrenIds.push(internode.id);

          // Occasional secondary lateral shoot sprouting from lower internodes
          if (idx === 1 && generation === 1 && rng() < 0.55) {
            const sideSign = rng() > 0.5 ? 1 : -1;
            const latAngle = bendAngle + sideSign * (0.52 + rng() * 0.2);
            this.buildInternodeChain({
              parentNode: internode,
              attachT: 1.0,
              dirAngle: latAngle,
              numInternodes: 2,
              startBirth: matureAge + 0.06,
              baseGirth: nextGirth * 0.85,
              woodiness: 0.1,
              hasWire: false,
              generation: generation + 1
            });
          }

          curParent = internode;
          curAttachT = 1.0;
          curX = nextX;
          curY = nextY;
          curAngle = bendAngle;
          curBirth = matureAge;
          curGirth = nextGirth;
        }
      }

      createNodeLeaves(stemAngle, nodeMatureAge, internodeIdx, totalInternodes, generation) {
        const rng = this.rng;
        const leaves = [];
        const isTerminal = (internodeIdx === totalInternodes - 1);

        // Opposite phyllotaxy: 2 leaves (left and right of the stem node)
        const sides = [-1, 1];
        for (const side of sides) {
          // Petiole angles outward from the node
          const petioleAngle = stemAngle + side * (0.65 + rng() * 0.35);
          // Blade arches outward/downward slightly with gravity
          const bladeAngle = petioleAngle + side * (0.25 + rng() * 0.25);

          // Leaf size: lower/middle leaves on the shoot grow large (like Photo 3 & 5!),
          // while brand-new apical tip leaves are slightly smaller/younger.
          // Also higher generations (after repeated pruning/ramification) produce finer, smaller bonsai leaves!
          const ramificationScale = Math.pow(0.86, Math.max(0, generation - 1));
          const maxRadius = (isTerminal ? (19 + rng() * 7) : (26 + rng() * 11)) * ramificationScale;
          const maxPetioleLen = (isTerminal ? (10 + rng() * 5) : (15 + rng() * 8)) * ramificationScale;

          leaves.push({
            id: `LF_${this.nodeCounter++}`,
            side,
            petioleAngle,
            bladeAngle,
            maxRadius,
            maxPetioleLen,
            birthAge: nodeMatureAge,
            fullLeafAge: Math.min(1.0, nodeMatureAge + 0.28),
            layerLight: 0.35 + rng() * 0.65, // Depth shading (0.35 = shaded interior, 1.0 = sunlit front)
            hueShift: (rng() - 0.5) * 14,
            seed: Math.floor(rng() * 99999),
            pruned: false
          });
        }
        return leaves;
      }

      countActiveLeaves(nodeId) {
        const node = this.nodes.get(nodeId);
        if (!node || node.pruned) return 0;
        let count = node.leaves ? node.leaves.filter(l => !l.pruned).length : 0;
        for (const cid of node.childrenIds) {
          count += this.countActiveLeaves(cid);
        }
        return count;
      }

      /*
       * Advance 1 Season (+1 Temporada):
       * 1. Photosynthetic thickening: Every surviving internode and trunk head thickens
       *    proportionally to the leaves it supported, and green stubs lignify into woody bark (like Photo 4!).
       * 2. Opposite Bud Awakening (Bifurcation): Any internode whose tip was pruned (or unpruned tips)
       *    awakens its two opposite axillary buds, sprouting a Y-bifurcation of 2 new shoots!
       */
      growSeason(metabolicFactor = 1.0) {
        this.seasonCount++;
        const rng = this.rng;

        // 1. Thicken and lignify all surviving nodes
        for (const [id, node] of this.nodes) {
          if (node.pruned) continue;
          const leafCount = this.countActiveLeaves(id);
          const vigor = Math.max(1, leafCount);

          if (node.type === 'TRUNK' || node.type === 'TRUNK_HEAD') {
            node.currentGirth += (0.45 + Math.sqrt(vigor) * 0.25) * metabolicFactor;
            node.endGirth = node.currentGirth * 0.82;
          } else {
            // Internode stubs thicken noticeably (turning into green-woody structural branches like Photo 4)
            const depthWeight = Math.max(0.35, 1.2 - node.depth * 0.2);
            node.currentGirth += (0.45 + Math.sqrt(vigor) * 0.28) * depthWeight * metabolicFactor;
            node.endGirth = Math.max(1.4, node.currentGirth * 0.85);
            node.woodiness = Math.min(0.92, node.woodiness + 0.28);
          }
          // Compress birthAge so existing wood is already 100% present at the start of the new season
          node.birthAge = Math.min(0.08, node.birthAge * 0.25);
          node.matureAge = Math.min(0.14, node.matureAge * 0.28);
          for (const lf of node.leaves) {
            lf.birthAge = node.matureAge;
            lf.fullLeafAge = Math.min(0.45, node.matureAge + 0.22);
          }
        }

        // 2. Find terminal internodes (especially pruned stubs!) to sprout opposite Y-bifurcations
        const terminalStubs = [];
        for (const [, node] of this.nodes) {
          if (node.pruned || node.type !== 'INTERNODE') continue;
          const activeChildren = node.childrenIds.filter(cid => {
            const c = this.nodes.get(cid);
            return c && !c.pruned;
          });
          if (activeChildren.length === 0 && node.depth < 5) {
            terminalStubs.push(node);
          }
        }

        for (const stub of terminalStubs) {
          // If the stub was pruned (hasChopScar), BOTH opposite axillary buds wake up -> true Y bifurcation!
          const isPrunedStub = stub.hasChopScar;
          const spreadAngles = isPrunedStub
            ? [-0.46 + (rng() - 0.5) * 0.12, 0.46 + (rng() - 0.5) * 0.12]
            : [(rng() - 0.5) * 0.35];

          for (const deltaAngle of spreadAngles) {
            const newAngle = stub.dirAngle + deltaAngle;
            const startBirth = 0.16 + rng() * 0.12;
            this.buildInternodeChain({
              parentNode: stub,
              attachT: 0.96,
              dirAngle: newAngle,
              numInternodes: 2 + (rng() > 0.5 ? 1 : 0),
              startBirth,
              baseGirth: Math.max(1.5, stub.endGirth * 0.72),
              woodiness: 0.15,
              hasWire: false,
              generation: stub.depth + 1
            });
          }
        }
      }

      /*
       * Prune at a specific internode (Sentei):
       * Severs `nodeId` and all its descendants, leaving `node.parentId` as a stub
       * with a fresh green-white / cut-paste scar (like Photo 4!).
       */
      pruneNode(nodeId, liveGeom) {
        const node = this.nodes.get(nodeId);
        if (!node || node.pruned || node.type === 'TRUNK' || node.type === 'TRUNK_HEAD') return false;

        const affectedIds = [];
        this.collectDescendantIds(nodeId, affectedIds);

        const parent = node.parentId ? this.nodes.get(node.parentId) : null;
        this.history.push({
          action: 'PRUNE',
          nodeId,
          affectedIds,
          prevParentScar: parent ? parent.hasChopScar : false,
          prevParentScarStyle: parent ? parent.scarStyle : null
        });

        // Spawn falling clipping animation for severed segments
        for (const id of affectedIds) {
          const n = this.nodes.get(id);
          if (n && !n.pruned) {
            const g = liveGeom && liveGeom.get(id);
            if (g) {
              fallingClippings.push({
                p0x: g.p0x, p0y: g.p0y,
                p1x: g.p1x, p1y: g.p1y,
                vx: (Math.random() - 0.5) * 1.4,
                vy: 0.8 + Math.random() * 1.2,
                alpha: 1.0,
                leaves: n.leaves ? n.leaves.filter(l => !l.pruned) : []
              });
            }
            n.pruned = true;
          }
        }

        // Leave a fresh green/cream cambium cut scar on the remaining parent stub (Photo 4!)
        if (parent) {
          parent.hasChopScar = true;
          parent.scarStyle = 'FRESH_GREEN_CUT';
        }

        return true;
      }

      /*
       * Pinch / Defoliate (Metsumi / Mekiri):
       * Removes the outer leaves on the hovered internode or trims the apical tip,
       * letting light into the interior and reducing leaf size.
       */
      pinchNode(nodeId) {
        const node = this.nodes.get(nodeId);
        if (!node || node.pruned || !node.leaves) return false;

        const activeLeaves = node.leaves.filter(l => !l.pruned);
        if (activeLeaves.length > 0) {
          this.history.push({
            action: 'PINCH',
            nodeId,
            prevPrunedStates: node.leaves.map(l => l.pruned)
          });
          for (const lf of node.leaves) {
            lf.pruned = true;
          }
          return true;
        }
        return false;
      }

      collectDescendantIds(nodeId, list) {
        list.push(nodeId);
        const node = this.nodes.get(nodeId);
        if (node) {
          for (const cid of node.childrenIds) {
            this.collectDescendantIds(cid, list);
          }
        }
      }

      undo() {
        if (this.history.length === 0) return false;
        const last = this.history.pop();
        if (last.action === 'PRUNE') {
          for (const id of last.affectedIds) {
            const n = this.nodes.get(id);
            if (n) n.pruned = false;
          }
          const node = this.nodes.get(last.nodeId);
          if (node && node.parentId) {
            const parent = this.nodes.get(node.parentId);
            if (parent) {
              parent.hasChopScar = last.prevParentScar;
              parent.scarStyle = last.prevParentScarStyle;
            }
          }
          return true;
        } else if (last.action === 'PINCH') {
          const node = this.nodes.get(last.nodeId);
          if (node && node.leaves) {
            node.leaves.forEach((lf, i) => {
              lf.pruned = last.prevPrunedStates[i];
            });
          }
          return true;
        }
        return false;
      }
    }

    /* ====================================================================
       4. MONSTERA / IRIS SPECIMEN (SECONDARY OPTION IN SELECTOR)
       ==================================================================== */
    class MonsteraClump {
      constructor(seed) {
        this.seed = seed;
        this.rng = createPRNG(seed);
        this.petioles = [];
        this.aerialRoots = [];
        this.buildGenetics();
      }
      buildGenetics() {
        const rng = this.rng;
        const totalLeaves = 12 + Math.floor(rng() * 3);
        const goldenAngles = [-0.12, 0.22, -0.38, 0.44, -0.05, -0.58, 0.62, 0.14, -0.28, 0.34, -0.48, 0.52, -0.18, 0.06];
        for (let i = 0; i < totalLeaves; i++) {
          const maturityOrder = i / (totalLeaves - 1);
          const birthAge = i * (0.84 / totalLeaves) + 0.01;
          const fullMaturityAge = Math.min(1.0, birthAge + 0.19);
          const side = (i % 2 === 0 ? 1 : -1);
          const fanAngle = goldenAngles[i % goldenAngles.length] + (rng() - 0.5) * 0.14;
          const nodeX = Math.sin(i * 0.9) * 8 + (rng() - 0.5) * 5;
          const nodeY = -6 - i * 8.5;
          const maxPetioleLength = 75 + maturityOrder * 155 + (rng() - 0.5) * 20;
          const maxBladeLength = 48 + maturityOrder * 92 + (rng() - 0.5) * 10;
          const maxBladeWidth = 38 + maturityOrder * 82 + (rng() - 0.5) * 10;
          let slitPairs = i >= 4 ? (i > 6 ? 3 : 1) : 0;
          const slits = [];
          for (let s = 0; s < slitPairs; s++) {
            slits.push({
              uCenter: 0.22 + (s / Math.max(1, slitPairs)) * 0.60,
              uThickness: 0.04,
              innerStartV: 0.24,
              sideMask: 0
            });
          }
          this.petioles.push({
            index: i,
            parentIndex: i === 0 ? -1 : i - 1,
            nodeX, nodeY,
            codeId: `L${String(i + 1).padStart(2, '0')}`,
            maturityOrder, birthAge, fullMaturityAge,
            side, fanAngle,
            maxPetioleLength, maxBladeLength, maxBladeWidth,
            geniculumDrop: fanAngle * 0.35,
            slits,
            hasInnerHoles: i >= 8,
            leafSeed: Math.floor(rng() * 99999)
          });
        }
      }
    }

    let currentBonsaiTree = new FractalBonsaiTree(currentSeed, currentSpecies);
    let currentPlant = new MonsteraClump(currentSeed);

    /* ====================================================================
       5. HIGH-RES ASCII RENDERING ENGINE (ZERO FLOATING UI CLUTTER)
       ==================================================================== */

    let viewW = window.innerWidth || 960;
    let viewH = window.innerHeight || 700;
    let activeBonsaiTool = 'PRUNE';
    let hoveredNodeId = null;
    let hoveredDescendantSet = new Set();
    let lastLiveGeom = new Map();

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      viewW = Math.max(320, rect.width || window.innerWidth || 960);
      viewH = Math.max(320, rect.height || window.innerHeight || 700);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateSeasonAndClock() {
      if (isTimeLapse) {
        growthProgress += 0.0014;
        if (growthProgress >= 1.0) {
          growthProgress = 1.0;
          toggleTimeLapse(false);
        }
        ageSlider.value = growthProgress;
      }

      // Map growthProgress (0.04 -> 1.0) to Japanese Bonsai Calendar Months (3月 Mar -> 6月 Jun)
      if (growthProgress < 0.25) {
        ageDaysLabel.innerText = '3月 (MARZO)';
        phaseLabel.innerText = '3月 (MAR) BROTACIÓN YEMAS';
        phaseLabel.className = 'text-[#37ecc4]';
      } else if (growthProgress < 0.52) {
        ageDaysLabel.innerText = '4月 (ABRIL)';
        phaseLabel.innerText = '4月 (ABR) ELONGACIÓN BROTES';
        phaseLabel.className = 'text-[#67b8ff]';
      } else if (growthProgress < 0.78) {
        ageDaysLabel.innerText = '5月 (MAYO)';
        phaseLabel.innerText = '5月 (MAY) EXPANSIÓN FOLIAR';
        phaseLabel.className = 'text-[#89aaff]';
      } else {
        ageDaysLabel.innerText = '6月 (JUNIO)';
        phaseLabel.innerText = '6月 (JUN) COPA DENSA / PODA';
        phaseLabel.className = 'text-[#b294ff]';
      }
      seasonBadge.innerText = `AÑO ${currentBonsaiTree.seasonCount}`;
    }

    function renderBioCanvas() {
      if (canvas.width === 0 || canvas.height === 0) resizeCanvas();
      ctx.fillStyle = '#020305';
      ctx.fillRect(0, 0, viewW, viewH);

      const potRimX = viewW / 2;
      const potRimY = viewH * 0.78;
      const responsiveScale = Math.min(1.22, Math.max(0.68, Math.min(viewW / 640, viewH / 680)));

      if (currentSpecies.startsWith('BONSAI')) {
        renderBonsaiSpecimen(ctx, potRimX, potRimY, responsiveScale);
      } else {
        renderMonsteraSpecimen(ctx, potRimX, potRimY, responsiveScale);
      }
    }

    function renderBonsaiSpecimen(c, potRimX, potRimY, scale) {
      c.save();
      c.translate(potRimX, potRimY);
      c.scale(scale, scale);

      // 1. Draw Terracotta / Glazed Bonsai Pot, Moss Mound & White Tamahi Fertilizer Cakes
      drawBonsaiPotAndMoss(c, currentBonsaiTree);

      // 2. Draw Muscular Nebari Surface Roots gripping the soil
      const trunkThickFactor = Math.min(1.0, 0.78 + growthProgress * 0.22);
      for (const root of currentBonsaiTree.nebariRoots) {
        drawNebariRoot(c, root, trunkThickFactor);
      }

      // 3. Compute Live Continuous Geometry (Zero floating parts!)
      const liveGeom = new Map();
      const sortedNodes = Array.from(currentBonsaiTree.nodes.values()).sort((a, b) => a.birthAge - b.birthAge);
      const leavesToRender = [];
      let activeInternodeCount = 0;

      for (const node of sortedNodes) {
        if (node.pruned) continue;

        let anchorX = node.p0x;
        let anchorY = node.p0y;

        if (node.parentId) {
          const pGeom = liveGeom.get(node.parentId);
          if (!pGeom) continue; // Parent not yet born
          const reqT = node.parentAttachT !== undefined ? node.parentAttachT : 1.0;
          if (pGeom.curT < reqT - 0.02) continue; // Parent hasn't reached insertion point yet!

          const aPt = evalQuadBezier(pGeom.p0x, pGeom.p0y, pGeom.cpx, pGeom.cpy, pGeom.p1x, pGeom.p1y, Math.min(1.0, reqT));
          anchorX = aPt.x;
          anchorY = aPt.y;
        }

        if (growthProgress < node.birthAge) continue;

        const span = Math.max(0.03, node.matureAge - node.birthAge);
        const curT = Math.min(1.0, Math.max(0.02, (growthProgress - node.birthAge) / span));

        // Translate original curve if anchor shifted slightly
        const dx = anchorX - node.p0x;
        const dy = anchorY - node.p0y;
        const sub = getBezierSubCurve(
          anchorX, anchorY,
          node.cpx + dx, node.cpy + dy,
          node.p1x + dx, node.p1y + dy,
          curT
        );

        liveGeom.set(node.id, {
          curT,
          p0x: sub.p0x, p0y: sub.p0y,
          cpx: sub.cpx, cpy: sub.cpy,
          p1x: sub.p1x, p1y: sub.p1y,
          node
        });

        const isCutPreview = hoveredDescendantSet.has(node.id);
        const isCutRoot = (hoveredNodeId === node.id);

        if (node.type === 'TRUNK' || node.type === 'TRUNK_HEAD') {
          drawMuscularTrunkNode(c, node, sub, curT, trunkThickFactor);
        } else {
          activeInternodeCount++;
          drawInternodeStem(c, node, sub, curT, trunkThickFactor, isCutPreview, isCutRoot);

          // Collect leaves attached to the tip of this internode once the internode reaches >= 85% elongation
          if (curT >= 0.82 && node.leaves && node.leaves.length > 0) {
            for (const lf of node.leaves) {
              if (lf.pruned) continue;
              const lfSpan = Math.max(0.06, lf.fullLeafAge - lf.birthAge);
              const rawLeafAge = (growthProgress - lf.birthAge) / lfSpan;
              if (rawLeafAge <= 0.01) continue;
              const leafAge = Math.min(1.0, Math.max(0.04, rawLeafAge));
              leavesToRender.push({
                stemX: sub.p1x,
                stemY: sub.p1y,
                leaf: lf,
                leafAge,
                isCutPreview: isCutPreview || (activeBonsaiTool === 'PINCH' && isCutRoot)
              });
            }
          }
        }
      }

      lastLiveGeom = liveGeom;

      // 4. Sort and Render Leaves by depth layer (shaded interior leaves first, sunlit front leaves on top!)
      leavesToRender.sort((a, b) => a.leaf.layerLight - b.leaf.layerLight);
      for (const item of leavesToRender) {
        drawSpeciesFoliage(c, item.stemX, item.stemY, item.leaf, item.leafAge, item.isCutPreview);
      }

      // 5. Render Falling Pruned Clippings Animation
      for (let i = fallingClippings.length - 1; i >= 0; i--) {
        const clip = fallingClippings[i];
        clip.p0x += clip.vx;
        clip.p1x += clip.vx;
        clip.p0y += clip.vy;
        clip.p1y += clip.vy;
        clip.vy += 0.18; // Gravity
        clip.alpha -= 0.032;

        if (clip.alpha <= 0) {
          fallingClippings.splice(i, 1);
          continue;
        }

        c.save();
        c.globalAlpha = Math.max(0, clip.alpha);
        c.font = '5.5px "JetBrains Mono", monospace';
        c.fillStyle = 'rgba(255, 110, 120, 0.9)';
        c.fillText('/', (clip.p0x + clip.p1x) * 0.5, (clip.p0y + clip.p1y) * 0.5);
        for (const lf of clip.leaves) {
          drawSpeciesFoliage(c, clip.p1x, clip.p1y, lf, 0.65, true);
        }
        c.restore();
      }

      c.restore();

      // Update Top Pill Telemetry
      hudPetioles.innerText = `${leavesToRender.length}`;
      hudFenestration.innerText = `${activeInternodeCount} NUDOS`;
    }

    /*
     * Renders the muscular, heavily tapered woody trunk base & chopped trunk heads
     * with vertical bark striations and realistic saw-cut calluses / grey cut paste (Photos 1, 2, 4).
     */
    function drawMuscularTrunkNode(c, node, sub, curT, thickFactor) {
      const steps = 20;
      c.font = '6px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';

      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const pt = evalQuadBezier(sub.p0x, sub.p0y, sub.cpx, sub.cpy, sub.p1x, sub.p1y, t);
        const radius = (node.currentGirth * (1 - t) + node.endGirth * t) * thickFactor;

        const nx = -Math.sin(pt.angle);
        const ny = Math.cos(pt.angle);

        for (let w = -radius; w <= radius; w += 2.3) {
          const cylNorm = w / Math.max(1, radius); // -1 (left) to +1 (right)
          const px = pt.x + nx * w;
          const py = pt.y + ny * w;

          // Solid dark silhouette occlusion
          c.fillStyle = 'rgba(2, 4, 7, 0.92)';
          c.fillRect(px - 1.3, py - 1.3, 2.6, 2.6);

          // Cylindrical 3D bark shading + vertical striation ribs (like Photo 2 maple bark)
          const ribWave = Math.sin(w * 0.55 + node.p0x * 0.2) * 0.14;
          const light = Math.max(0.05, Math.cos((cylNorm + 0.28) * 1.38) + ribWave);
          const isEdge = Math.abs(cylNorm) > 0.84;

          let ch = CHARS_BARK[Math.abs(Math.floor(s + w * 2)) % CHARS_BARK.length];
          if (isEdge) {
            ch = cylNorm < 0 ? '(' : ')';
            c.fillStyle = cylNorm < 0 ? 'rgba(215, 208, 192, 0.90)' : 'rgba(72, 82, 78, 0.78)';
          } else if (light > 0.74) {
            // Sunlit smooth silver-taupe Acer bark
            c.fillStyle = 'rgba(202, 194, 176, 0.92)';
            ch = s % 2 === 0 ? '|' : '#';
          } else if (light > 0.44) {
            c.fillStyle = 'rgba(148, 144, 130, 0.86)';
            ch = '¦';
          } else {
            // Shaded mossy-slate bark
            c.fillStyle = 'rgba(78, 86, 78, 0.80)';
            ch = ':';
          }
          c.fillText(ch, px, py);
        }
      }

      // Draw Heavy Chop Scar / Grey Cut Paste at the top of the woody trunk head (Photos 1, 2, 4)
      if (node.hasChopScar && curT > 0.9) {
        const scarX = sub.p1x;
        const scarY = sub.p1y;
        const scarW = node.endGirth * 0.78;

        for (let sx = -scarW; sx <= scarW; sx += 2.2) {
          for (let sy = -3.2; sy <= 3.2; sy += 2.0) {
            if ((sx * sx) / (scarW * scarW) + (sy * sy) / (3.4 * 3.4) <= 1.0) {
              c.fillStyle = 'rgba(4, 7, 10, 0.95)';
              c.fillRect(scarX + sx - 1.2, scarY + sy - 1.2, 2.4, 2.4);

              if (node.scarStyle === 'DARK_PASTE') {
                // Dark grey Japanese cut-paste blob (like Photo 1, 2, 4)
                c.fillStyle = sy < 0 ? 'rgba(115, 125, 138, 0.92)' : 'rgba(68, 76, 88, 0.92)';
                c.fillText('@', scarX + sx, scarY + sy);
              } else {
                // Angled woody bevel chop with pale callus rim (Photo 2 right trunk head)
                const isRim = Math.abs(sx) > scarW * 0.68 || Math.abs(sy) > 2.0;
                c.fillStyle = isRim ? 'rgba(195, 210, 165, 0.94)' : 'rgba(225, 215, 185, 0.90)';
                c.fillText(isRim ? '(' : '=', scarX + sx, scarY + sy);
              }
            }
          }
        }
      }
    }

    /*
     * Renders an individual Internode stem segment (entrenudo).
     * Shows the transition from slender reddish-green spring shoot (Photo 1 & 2)
     * to thickened green-barked structural stub (Photo 4) with node rings!
     */
    function drawInternodeStem(c, node, sub, curT, thickFactor, isCutPreview, isCutRoot) {
      const steps = Math.max(5, Math.floor((node.length * curT) / 2.4));
      c.font = '5.6px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';

      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const pt = evalQuadBezier(sub.p0x, sub.p0y, sub.cpx, sub.cpy, sub.p1x, sub.p1y, t);
        const radius = Math.max(0.9, (node.currentGirth * (1 - t) + node.endGirth * t) * thickFactor);

        const nx = -Math.sin(pt.angle);
        const ny = Math.cos(pt.angle);

        for (let w = -radius; w <= radius; w += 2.0) {
          const px = pt.x + nx * w;
          const py = pt.y + ny * w;

          c.fillStyle = 'rgba(2, 5, 8, 0.85)';
          c.fillRect(px - 1.1, py - 1.1, 2.2, 2.2);

          if (isCutPreview) {
            // Subtle coral-red tint on segments that will be severed upon clicking
            c.fillStyle = 'rgba(255, 95, 110, 0.92)';
            c.fillText('x', px, py);
          } else if (node.woodiness > 0.55) {
            // Semi-woody green-brown bark (like the thickened stubs in Photo 4)
            c.fillStyle = w <= 0 ? 'rgba(155, 182, 130, 0.92)' : 'rgba(92, 128, 82, 0.84)';
            c.fillText('|', px, py);
          } else {
            // Slender young Maple shoot: green base transitioning to reddish-coral towards the sun/tip (Photos 1 & 2)
            const isReddishShoot = (t > 0.45 && node.depth >= 1);
            c.fillStyle = isReddishShoot
              ? 'rgba(215, 115, 95, 0.92)'
              : (w <= 0 ? 'rgba(148, 215, 115, 0.92)' : 'rgba(95, 165, 82, 0.85)');
            c.fillText(Math.abs(Math.cos(pt.angle)) > 0.6 ? '-' : '/', px, py);
          }
        }

        // Render black anodized training wire coiled around wired branch (Photo 2 right shoot!)
        if (node.hasWire && s % 3 === 1 && !isCutPreview) {
          const wireW = Math.sin((s / steps) * Math.PI * 4.0) * (radius + 1.0);
          c.fillStyle = 'rgba(225, 165, 110, 0.95)';
          c.fillText('@', pt.x + nx * wireW, pt.y + ny * wireW);
        }
      }

      // Draw Node Ring (anillo de entrenudo) at the tip of the internode
      if (curT > 0.92 && !isCutPreview) {
        c.fillStyle = 'rgba(185, 215, 155, 0.85)';
        c.fillText('=', sub.p1x, sub.p1y);
      }

      // If this internode was pruned at its tip, draw the fresh green-white bevel cut face (Photo 4!)
      if (node.hasChopScar && node.scarStyle === 'FRESH_GREEN_CUT' && !isCutPreview) {
        c.font = '6.5px "JetBrains Mono", monospace';
        // Outer green cambium ring + pale cream wood core (exactly like Photo 4!)
        c.fillStyle = 'rgba(135, 225, 115, 0.96)';
        c.fillText('(', sub.p1x - 2.5, sub.p1y - 1);
        c.fillText(')', sub.p1x + 2.5, sub.p1y - 1);
        c.fillStyle = 'rgba(235, 242, 205, 0.96)';
        c.fillText('o', sub.p1x, sub.p1y - 1);
      }

      // Clean geometric cut-mark line right at the base of the hovered internode (No floating text!)
      if (isCutRoot) {
        c.save();
        c.strokeStyle = activeBonsaiTool === 'PRUNE' ? '#ff5370' : '#37ecc4';
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(sub.p0x - 8, sub.p0y - 6);
        c.lineTo(sub.p0x + 8, sub.p0y + 6);
        c.stroke();
        c.restore();
      }
    }

    /*
     * Dispatches leaf rendering based on selected Bonsai species.
     */
    function drawSpeciesFoliage(c, stemX, stemY, leaf, leafAge, isCutPreview) {
      const leafType = currentBonsaiTree.spec.leafType;
      if (leafType === 'MAPLE_PALMATE') {
        drawMaplePalmateLeaf(c, stemX, stemY, leaf, leafAge, isCutPreview);
      } else if (leafType === 'PINE_NEEDLE') {
        drawPineNeedleCluster(c, stemX, stemY, leaf, leafAge, isCutPreview);
      } else {
        drawElmSerratedLeaf(c, stemX, stemY, leaf, leafAge, isCutPreview);
      }
    }

    /*
     * AUTHENTIC 5-LOBED PALMATE JAPANESE MAPLE LEAF (ACER PALMATUM / MOMIJI)
     * Matches Photos 1, 2, 3, 4, 5:
     * 1. Long, slender reddish-coral petiole (pecíolo) emerging from the node.
     * 2. 5 distinct pointed, serrated lobes radiating like an open hand from the leaf base:
     *    - Central lobe (longest, 0°)
     *    - Left & Right upper lateral lobes (±42°)
     *    - Left & Right outer basal lobes (±82°)
     * 3. Realistic Ontogeny:
     *    - Early spring (leafAge < 0.35, 3月 Mar): Small, narrower lobe spread, warm bronze-red / salmon-amber tint.
     *    - Late spring / June (leafAge 0.35..1.0, 6月 Jun): Large, broad 5-pointed star canopy in layered emerald greens.
     */
    function drawMaplePalmateLeaf(c, stemX, stemY, leaf, leafAge, isCutPreview) {
      // 1. Slender Reddish Petiole (Pecíolo) connecting stem node to leaf lamina base
      const petioleLen = leaf.maxPetioleLen * (0.25 + 0.75 * Math.pow(leafAge, 0.75));
      const pEndX = stemX + Math.cos(leaf.petioleAngle) * petioleLen;
      const pEndY = stemY + Math.sin(leaf.petioleAngle) * petioleLen + (2.5 * leafAge); // Subtle gravity droop
      const pCtrlX = (stemX + pEndX) * 0.5;
      const pCtrlY = (stemY + pEndY) * 0.5 - 1.5;

      c.font = '5px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';

      const pSteps = Math.max(3, Math.floor(petioleLen / 2.5));
      for (let s = 1; s <= pSteps; s++) {
        const t = s / pSteps;
        const pt = evalQuadBezier(stemX, stemY, pCtrlX, pCtrlY, pEndX, pEndY, t);
        c.fillStyle = isCutPreview ? 'rgba(255, 95, 110, 0.9)' : 'rgba(220, 85, 80, 0.88)';
        c.fillText(t > 0.5 ? '-' : ':', pt.x, pt.y);
      }

      // 2. Render the 5 Pointed Serrated Lobes of Acer palmatum from (pEndX, pEndY)
      const bladeRadius = leaf.maxRadius * (0.18 + 0.82 * Math.pow(leafAge, 0.82));
      // As the leaf unfurls from March (leafAge ~ 0.1) to June (leafAge ~ 1.0), the 5 lobes fan open wider
      const fanOpenFactor = 0.52 + 0.48 * Math.min(1.0, leafAge * 1.25);

      const lobes = [
        { relAngle: -1.42 * fanOpenFactor, lenScale: 0.54, widthScale: 0.21 }, // Basal Left Lobe
        { relAngle:  1.42 * fanOpenFactor, lenScale: 0.54, widthScale: 0.21 }, // Basal Right Lobe
        { relAngle: -0.72 * fanOpenFactor, lenScale: 0.86, widthScale: 0.25 }, // Lateral Left Lobe
        { relAngle:  0.72 * fanOpenFactor, lenScale: 0.86, widthScale: 0.25 }, // Lateral Right Lobe
        { relAngle:  0.00,                 lenScale: 1.00, widthScale: 0.27 }  // Central Dominant Lobe
      ];

      const isAutumn = (environment.seasonTheme === 'AUTUMN_MOMIJI');
      // Young March leaves (< 0.36) have bronze-crimson/apricot tips (Photos 1 & 2!)
      const springBronzeBlend = Math.max(0, 1 - (leafAge / 0.38));

      c.font = '5.2px "JetBrains Mono", monospace';

      for (let lIdx = 0; lIdx < lobes.length; lIdx++) {
        const lobe = lobes[lIdx];
        const lobeLen = bladeRadius * lobe.lenScale;
        const lobeMaxHalfW = bladeRadius * lobe.widthScale;
        const lobeWorldAngle = leaf.bladeAngle + lobe.relAngle;

        c.save();
        c.translate(pEndX, pEndY);
        c.rotate(lobeWorldAngle);

        const stepU = 2.6;
        const stepV = 2.4;
        const cols = Math.max(3, Math.floor(lobeLen / stepU));

        for (let i = 0; i <= cols; i++) {
          const u = i / cols; // 0 = palm center, 1 = sharp pointed lobe apex

          // Lanceolate-diamond maple lobe silhouette with sharp serrated marginal teeth
          const serrationTeeth = 1.0 + Math.sin(i * 2.7) * 0.22;
          const baseFusion = u < 0.22 ? 0.55 + u * 2.0 : Math.sin(Math.pow(u, 0.68) * Math.PI);
          const acuminateTip = 1.0 - Math.pow(u, 2.2) * 0.35;
          const halfW = lobeMaxHalfW * baseFusion * acuminateTip * serrationTeeth;

          const rowSpan = Math.max(0, Math.round(halfW / stepV));

          for (let j = -rowSpan; j <= rowSpan; j++) {
            const px = u * lobeLen;
            const py = j * stepV;

            // Dark background occlusion so front leaves stand out in crisp relief over back leaves (Photos 3 & 5)
            c.fillStyle = 'rgba(2, 5, 8, 0.82)';
            c.fillRect(px - 1.25, py - 1.25, 2.5, 2.5);

            const isMainVein = (j === 0 && u < 0.88);
            const isSerratedMargin = (Math.abs(j) === rowSpan && rowSpan > 0) || i === cols;

            let glyph;
            if (isCutPreview) {
              c.fillStyle = isMainVein ? 'rgba(255, 180, 185, 0.95)' : 'rgba(255, 85, 105, 0.88)';
              glyph = isMainVein ? '-' : 'x';
            } else {
              // Calculate authentic Acer palmatum color
              let hue, sat, light;
              if (isAutumn) {
                hue = 8 + leaf.hueShift + u * 18;
                sat = 88;
                light = 38 + leaf.layerLight * 24;
              } else if (springBronzeBlend > 0.05) {
                // Transition from March bronze-red/amber (hue ~22) to May/June emerald green (hue ~116)
                const tipBronze = Math.min(1, springBronzeBlend * (0.6 + u * 0.7));
                hue = (24 * tipBronze) + ((114 + leaf.hueShift) * (1 - tipBronze));
                sat = 78 + (1 - tipBronze) * 10;
                light = 36 + leaf.layerLight * 26 + (isMainVein ? 14 : 0);
              } else {
                // Lush June Emerald Canopy (Photos 3 & 5): shaded forest interior vs sunlit lime-emerald exterior
                hue = 106 + (1 - leaf.layerLight) * 22 + leaf.hueShift - u * 8;
                sat = 76 + leaf.layerLight * 14;
                light = 28 + leaf.layerLight * 32 + (1 - Math.abs(j) / Math.max(1, rowSpan + 1)) * 8;
              }

              if (isMainVein) {
                glyph = '-';
                c.fillStyle = `hsla(${(hue - 12).toFixed(0)}, 90%, ${Math.min(78, light + 18).toFixed(0)}%, 0.96)`;
              } else if (isSerratedMargin) {
                glyph = i === cols ? '*' : (j > 0 ? '/' : '\\');
                c.fillStyle = `hsla(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${Math.min(72, light + 6).toFixed(0)}%, 0.94)`;
              } else {
                glyph = CHARS_BLADE_FILL[(i * 3 + Math.abs(j) + leaf.seed + lIdx) % CHARS_BLADE_FILL.length];
                c.fillStyle = `hsla(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%, 0.92)`;
              }
            }

            c.fillText(glyph, px, py);
          }
        }

        c.restore();
      }
    }

    function drawElmSerratedLeaf(c, stemX, stemY, leaf, leafAge, isCutPreview) {
      c.save();
      c.translate(stemX, stemY);
      c.rotate(leaf.bladeAngle);
      const len = leaf.maxRadius * 0.75 * leafAge;
      const halfW = len * 0.52;
      c.font = '5.2px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      const cols = Math.max(3, Math.floor(len / 2.6));
      for (let i = 0; i <= cols; i++) {
        const u = i / cols;
        const rowSpan = Math.round((halfW * Math.sin(u * Math.PI)) / 2.5);
        for (let j = -rowSpan; j <= rowSpan; j++) {
          const px = u * len;
          const py = j * 2.5;
          c.fillStyle = 'rgba(2, 5, 8, 0.82)';
          c.fillRect(px - 1.2, py - 1.2, 2.4, 2.4);
          c.fillStyle = isCutPreview
            ? 'rgba(255, 95, 110, 0.9)'
            : `hsla(${115 + leaf.hueShift}, 82%, ${34 + leaf.layerLight * 28}%, 0.92)`;
          c.fillText(j === 0 ? '-' : (Math.abs(j) === rowSpan ? '/' : '0'), px, py);
        }
      }
      c.restore();
    }

    function drawPineNeedleCluster(c, stemX, stemY, leaf, leafAge, isCutPreview) {
      const needleLen = leaf.maxRadius * 0.85 * leafAge;
      c.font = '5.2px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      for (let n = -3; n <= 3; n++) {
        const ang = leaf.bladeAngle + n * 0.24;
        const steps = Math.max(3, Math.floor(needleLen / 2.6));
        for (let s = 1; s <= steps; s++) {
          const px = stemX + Math.cos(ang) * (s * 2.6);
          const py = stemY + Math.sin(ang) * (s * 2.6);
          c.fillStyle = isCutPreview
            ? 'rgba(255, 95, 110, 0.9)'
            : `hsla(${138 + n * 4}, 75%, ${32 + leaf.layerLight * 26}%, 0.92)`;
          c.fillText('/', px, py);
        }
      }
    }

    function drawBonsaiPotAndMoss(c, tree) {
      const topW = 104;
      const potH = 48;
      const isTerracotta = tree.spec.potColor === 'TERRACOTTA';

      // 1. Domed Organic Soil & Green Moss Mound on top of the pot rim
      c.font = '6px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      const mossChars = ['*', '·', ':', 'w', '"', '°'];
      for (let my = -8; my <= 5; my += 2.5) {
        const domeProgress = (my + 8) / 13;
        const halfSpan = topW * Math.sin(Math.max(0.18, domeProgress) * Math.PI * 0.5) * 0.94;
        for (let mx = -halfSpan; mx <= halfSpan; mx += 3.0) {
          const isGreenMoss = Math.sin(mx * 0.18 + my * 0.5) > 0.05;
          c.fillStyle = isGreenMoss
            ? 'rgba(105, 198, 92, 0.78)'
            : 'rgba(138, 108, 78, 0.72)';
          c.fillText(mossChars[Math.abs(Math.floor(mx + my * 3)) % mossChars.length], mx, my);
        }
      }

      // 2. Round White/Cream Organic Fertilizer Cakes (Tamahi / Biogold) on the soil rim (Photos 1, 2, 3, 5!)
      if (tree.fertilizerPellets) {
        for (const p of tree.fertilizerPellets) {
          for (let py = -p.ry; py <= p.ry; py += 2.0) {
            for (let px = -p.rx; px <= p.rx; px += 2.2) {
              if ((px * px) / (p.rx * p.rx) + (py * py) / (p.ry * p.ry) <= 1.0) {
                c.fillStyle = 'rgba(4, 6, 9, 0.9)';
                c.fillRect(p.x + px - 1.1, p.y + py - 1.1, 2.2, 2.2);
                const domeShade = 1.0 - (py + p.ry) / (2 * p.ry) * 0.35;
                c.fillStyle = `rgba(235, 228, 210, ${(0.65 + domeShade * 0.3).toFixed(2)})`;
                c.fillText(py < 0 ? '#' : ':', p.x + px, p.y + py);
              }
            }
          }
        }
      }

      // 3. Bonsai Ceramic Pot (Warm Terracotta Tokoname Pot matching Photos 1, 2, 3, 5)
      for (let y = 5; y <= potH; y += 3.2) {
        const v = (y - 5) / (potH - 5);
        const halfW = topW * (1 - v * 0.18);
        const isLip = y <= 9.5;
        const isFootZone = y > potH - 6;

        for (let x = -halfW; x <= halfW; x += 3.1) {
          if (isFootZone && Math.abs(x) < halfW * 0.62) continue;

          const normX = x / halfW;
          const isEdge = Math.abs(x) >= halfW - 3.2 || isLip || y >= potH - 3.2;
          const light = Math.max(0.15, Math.cos((normX + 0.22) * 1.35) * 0.75 + (1 - v) * 0.25);

          if (isTerracotta) {
            if (isEdge) {
              c.fillStyle = isLip ? 'rgba(212, 138, 105, 0.90)' : 'rgba(145, 82, 58, 0.82)';
              c.fillText(isLip ? '=' : '|', x, y);
            } else {
              c.fillStyle = `rgba(178, 98, 68, ${(0.32 + light * 0.55).toFixed(2)})`;
              c.fillText(light > 0.62 ? '#' : (light > 0.38 ? ':' : '·'), x, y);
            }
          } else {
            if (isEdge) {
              c.fillStyle = isLip ? 'rgba(155, 215, 255, 0.85)' : 'rgba(75, 165, 235, 0.75)';
              c.fillText(isLip ? '=' : '|', x, y);
            } else {
              c.fillStyle = `rgba(55, 145, 225, ${(0.25 + light * 0.52).toFixed(2)})`;
              c.fillText(light > 0.62 ? '#' : ':', x, y);
            }
          }
        }
      }
    }

    function drawNebariRoot(c, root, thickFactor) {
      c.font = '6px "JetBrains Mono", monospace';
      const steps = 12;
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const rx = root.dirX * t;
        const ry = -2 + root.dirY * Math.pow(t, 0.85);
        const rad = root.thickness * (1 - t * 0.72) * thickFactor;
        for (let w = -rad; w <= rad; w += 2.4) {
          const norm = w / Math.max(1, rad);
          const shade = Math.max(0.2, Math.cos((norm + 0.3) * 1.3));
          c.fillStyle = 'rgba(2, 5, 8, 0.88)';
          c.fillRect(rx + w * 0.5 - 1.2, ry - Math.abs(norm) * 1.2 - 1.2, 2.4, 2.4);
          c.fillStyle = `rgba(182, 174, 156, ${(0.42 + shade * 0.48).toFixed(2)})`;
          c.fillText(shade > 0.65 ? '#' : ':', rx + w * 0.5, ry - Math.abs(norm) * 1.2);
        }
      }
    }

    /* ====================================================================
       6. MONSTERA / IRIS RENDERER (SECONDARY MODE)
       ==================================================================== */
    function renderMonsteraSpecimen(c, potRimX, potRimY, scale) {
      c.save();
      c.translate(potRimX, potRimY);
      c.scale(scale, scale);

      const computedCurves = {};
      const activePetioles = [];
      for (const p of currentPlant.petioles) {
        if (growthProgress >= p.birthAge) {
          const span = Math.max(0.05, p.fullMaturityAge - p.birthAge);
          const localAge = Math.max(0.02, Math.min(1.0, (growthProgress - p.birthAge) / span));
          const startX = p.nodeX;
          const startY = p.nodeY;
          const currentEndAngle = -Math.PI / 2 + p.fanAngle;
          const petioleLen = p.maxPetioleLength * localAge;
          const endX = startX + Math.cos(currentEndAngle) * petioleLen;
          const endY = startY + Math.sin(currentEndAngle) * petioleLen;
          const ctrlX = startX + (endX - startX) * 0.38;
          const ctrlY = startY + (endY - startY) * 0.68 - 14 * localAge;
          const geom = { startX, startY, ctrlX, ctrlY, endX, endY, currentEndAngle, petioleLen };
          computedCurves[p.index] = geom;
          activePetioles.push({ petiole: p, localAge, geom });
        }
      }

      for (const { petiole, localAge, geom } of activePetioles) {
        const steps = Math.max(10, Math.floor(geom.petioleLen / 3));
        c.font = '6px "JetBrains Mono", monospace';
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const pt = evalQuadBezier(geom.startX, geom.startY, geom.ctrlX, geom.ctrlY, geom.endX, geom.endY, t);
          c.fillStyle = 'rgba(75, 242, 190, 0.85)';
          c.fillText('|', pt.x, pt.y);
        }
        drawMonsteraBladeSimple(c, geom.endX, geom.endY, petiole, localAge, geom);
      }
      c.restore();
    }

    function drawMonsteraBladeSimple(c, x, y, p, localAge, geom) {
      c.save();
      c.translate(x, y);
      c.rotate(geom.currentEndAngle + Math.PI / 2);
      const bladeLen = p.maxBladeLength * localAge;
      const halfW = p.maxBladeWidth * 0.5 * localAge;
      const cols = Math.max(10, Math.floor(bladeLen / 3.2));
      c.font = '6px "JetBrains Mono", monospace';
      for (let i = 0; i <= cols; i++) {
        const u = i / cols;
        const env = Math.sin(u * Math.PI);
        const rows = Math.round((halfW * env) / 3.0);
        for (let j = -rows; j <= rows; j++) {
          c.fillStyle = `hsla(${195 + u * 35}, 90%, 58%, 0.88)`;
          c.fillText(j === 0 ? '|' : '0', j * 3.0, -u * bladeLen);
        }
      }
      c.restore();
    }

    /* ====================================================================
       7. INTERACTIVE PRUNING, PINCHING & CONTROLS
       ==================================================================== */
    const toolPrune = document.getElementById('toolPrune');
    const toolPinch = document.getElementById('toolPinch');
    const btnAdvanceSeason = document.getElementById('btnAdvanceSeason');
    const btnUndo = document.getElementById('btnUndo');
    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const bonsaiToolsPanel = document.getElementById('bonsaiToolsPanel');

    function distToQuadBezier(px, py, p0x, p0y, cpx, cpy, p1x, p1y, samples = 12) {
      let minDistSq = Infinity;
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const inv = 1 - t;
        const x = inv * inv * p0x + 2 * inv * t * cpx + t * t * p1x;
        const y = inv * inv * p0y + 2 * inv * t * cpy + t * t * p1y;
        const dSq = (px - x) * (px - x) + (py - y) * (py - y);
        if (dSq < minDistSq) minDistSq = dSq;
      }
      return Math.sqrt(minDistSq);
    }

    function setActiveBonsaiTool(tool) {
      activeBonsaiTool = tool;
      toolPrune.classList.toggle('active', tool === 'PRUNE');
      toolPinch.classList.toggle('active', tool === 'PINCH');
      canvas.classList.remove('canvas-prune', 'canvas-pinch');
      if (currentSpecies.startsWith('BONSAI')) {
        canvas.classList.add(tool === 'PRUNE' ? 'canvas-prune' : 'canvas-pinch');
      }
    }

    toolPrune.addEventListener('click', () => setActiveBonsaiTool('PRUNE'));
    toolPinch.addEventListener('click', () => setActiveBonsaiTool('PINCH'));

    btnAdvanceSeason.addEventListener('click', () => {
      if (currentSpecies.startsWith('BONSAI')) {
        bonsaiAudio.playChime();
        currentBonsaiTree.growSeason(environment.metabolicFactor);
        // Set slider to early spring (3月/4月) of the new season and start growing smoothly!
        growthProgress = 0.22;
        ageSlider.value = growthProgress;
        toggleTimeLapse(true);
      }
    });

    btnUndo.addEventListener('click', () => {
      if (currentSpecies.startsWith('BONSAI')) {
        if (currentBonsaiTree.undo()) bonsaiAudio.playChime();
      }
    });

    btnSoundToggle.addEventListener('click', () => {
      bonsaiAudio.enabled = !bonsaiAudio.enabled;
      btnSoundToggle.innerText = bonsaiAudio.enabled ? '🔊' : '🔇';
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!currentSpecies.startsWith('BONSAI')) {
        hoveredNodeId = null;
        hoveredDescendantSet.clear();
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const potRimX = viewW / 2;
      const potRimY = viewH * 0.78;
      const scale = Math.min(1.22, Math.max(0.68, Math.min(viewW / 640, viewH / 680)));

      const localX = (mouseX - potRimX) / scale;
      const localY = (mouseY - potRimY) / scale;

      let closestId = null;
      let minDist = 18.0;

      for (const [id, g] of lastLiveGeom) {
        const node = g.node;
        if (node.pruned || node.type === 'TRUNK' || node.type === 'TRUNK_HEAD') continue;
        const d = distToQuadBezier(localX, localY, g.p0x, g.p0y, g.cpx, g.cpy, g.p1x, g.p1y);
        if (d < minDist) {
          minDist = d;
          closestId = id;
        }
      }

      hoveredNodeId = closestId;
      hoveredDescendantSet.clear();
      if (hoveredNodeId && activeBonsaiTool === 'PRUNE') {
        const list = [];
        currentBonsaiTree.collectDescendantIds(hoveredNodeId, list);
        for (const id of list) hoveredDescendantSet.add(id);
      }
    });

    canvas.addEventListener('click', () => {
      bonsaiAudio.init();
      if (!currentSpecies.startsWith('BONSAI') || !hoveredNodeId) return;

      if (activeBonsaiTool === 'PRUNE') {
        if (currentBonsaiTree.pruneNode(hoveredNodeId, lastLiveGeom)) {
          bonsaiAudio.playSnip();
          hoveredNodeId = null;
          hoveredDescendantSet.clear();
        }
      } else if (activeBonsaiTool === 'PINCH') {
        if (currentBonsaiTree.pinchNode(hoveredNodeId)) {
          bonsaiAudio.playSnip();
          hoveredNodeId = null;
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoveredNodeId = null;
      hoveredDescendantSet.clear();
    });

    speciesSelect.addEventListener('change', (e) => {
      currentSpecies = e.target.value;
      const isBonsai = currentSpecies.startsWith('BONSAI');
      const idNum = (currentSeed % 900 + 100);
      if (isBonsai) {
        const spec = BONSAI_SPECIES_MODELS[currentSpecies] || BONSAI_SPECIES_MODELS['BONSAI_MAPLE'];
        specimenHeader.innerText = `${spec.botanicalName} #${idNum}`;
        currentBonsaiTree = new FractalBonsaiTree(currentSeed, currentSpecies);
      } else {
        specimenHeader.innerText = `IRIS_GECE_MAVISI #${idNum}`;
      }
      if (bonsaiToolsPanel) {
        bonsaiToolsPanel.style.display = isBonsai ? 'flex' : 'none';
      }
      setActiveBonsaiTool(activeBonsaiTool);
    });

    btnPlantNow.addEventListener('click', () => {
      if (isTimeLapse) toggleTimeLapse(false);
      growthProgress = 0.08; // Early March bud break (3月)
      ageSlider.value = growthProgress;
      toggleTimeLapse(true);
    });

    btnMutate.addEventListener('click', () => {
      currentSeed = Math.floor(Math.random() * 0xFFFFFF);
      seedDisplay.innerText = '0x' + currentSeed.toString(16).toUpperCase().padStart(6, '0');
      const idNum = (currentSeed % 900 + 100);
      if (currentSpecies.startsWith('BONSAI')) {
        const spec = BONSAI_SPECIES_MODELS[currentSpecies] || BONSAI_SPECIES_MODELS['BONSAI_MAPLE'];
        specimenHeader.innerText = `${spec.botanicalName} #${idNum}`;
      }
      currentBonsaiTree = new FractalBonsaiTree(currentSeed, currentSpecies);
      currentPlant = new MonsteraClump(currentSeed);
      hoveredNodeId = null;
      hoveredDescendantSet.clear();
    });

    function toggleTimeLapse(state) {
      isTimeLapse = (typeof state === 'boolean') ? state : !isTimeLapse;
      if (isTimeLapse && growthProgress >= 0.98) {
        growthProgress = 0.08;
      }
      playIcon.innerText = isTimeLapse ? '⏸' : '▶';
      playText.innerText = isTimeLapse ? 'PAUSAR' : 'CRECER';
    }
    btnTimeLapse.addEventListener('click', () => toggleTimeLapse());

    function animate() {
      globalTick++;
      updateSeasonAndClock();
      renderBioCanvas();
      requestAnimationFrame(animate);
    }

    function initApp() {
      resizeCanvas();
      seedDisplay.innerText = '0x' + currentSeed.toString(16).toUpperCase();
      setActiveBonsaiTool('PRUNE');
      animate();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
