<body class="w-screen h-screen relative flex flex-col justify-between p-2.5 md:p-4 overflow-hidden bg-[#020305]">

  <!-- BOTTOM CONTROL DOCK: Interactive Pruning, Organic Bud Stimulation & Real-Time Simulation Speed -->

          <option value="BONSAI_ULMUS" class="bg-[#06121c]">🌳 Olmo Chino (Ulmus Parvifolia)</option>

        </select>

      <button id="btnBareStump" title="Empezar desde el tronco base recién podado en Marzo (3月) para diseñar todas las ramas desde cero" class="px-2.5 py-1.5 bg-[#0b2230] hover:bg-[#13354a] border border-[#235370] text-[#9bd6ff] rounded transition active:scale-95">
        🪵 DESDE TRONCO (3月)
      </button>

      <button id="btnMutate" title="Generar un nuevo ejemplar único con otra semilla genética" class="px-2.5 py-1.5 bg-[#102d3e] hover:bg-[#18445f] border border-[#30709f] text-[#50e3c2] rounded transition active:scale-95 font-bold flex items-center gap-1">

      </button>

  <script>
    /* ====================================================================
       1. DETERMINISTIC PRNG & AUDIO SYNTHESIZER
       ==================================================================== */
    function createPRNG(seed) {
      let s = (typeof seed === 'number' ? seed : 0x84A3F2) >>> 0;
      return function() {
        let t = s += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    class BonsaiAudioSynth {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSnip() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1700, now);
          filter.frequency.exponentialRampToValueAtTime(3500, now + 0.04);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(2300, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.055);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }
      playBudPop() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.09);
          gain.gain.setValueAtTime(0.10, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      }
    }
    const bonsaiAudio = new BonsaiAudioSynth();

    /* ====================================================================
       2. CAUSAL BIOLOGICAL BONSAI ENGINE (HORMONAL AUXIN, BUDS & SAP FLOW)
       ====================================================================
       How this replicates real nature (Acer palmatum):
       - The tree is a living organism of Segments (Internodes & Trunk) and Buds (Yemas).
       - Active Apical Buds emit AUXIN downward, suppressing lateral buds below them.
       - Active Leaves photosynthesize, sending sugars downward (Pipe Model),
         physically thickening every supporting branch and trunk segment on that path!
       - WHEN YOU CUT A BRANCH:
         1. Apical dominance (auxin) above the cut vanishes immediately.
         2. Root sap & vigor that was feeding the cut branch is redirected to
            dormant buds on the cut stub AND latent buds on other parts of the trunk/branches!
         3. Those dormant buds visibly swell (glowing crimson-green) and burst into
            brand-new shoots growing in new directions!
    */

    let currentSeed = 0x84A3F2;
    let currentSpecies = 'BONSAI_MAPLE';
    let seasonTheme = 'SPRING'; // 'SPRING' | 'AUTUMN'
    let simSpeed = 1.0; // 0 = paused, 1.0 = organic real-time, 4.0 = fast-forward
    let activeTool = 'PRUNE'; // 'PRUNE' | 'PINCH'

    class LivingBonsaiOrganism {
      constructor(seed, species = 'BONSAI_MAPLE') {
        this.seed = seed;
        this.species = species;
        this.rng = createPRNG(seed);
        this.segments = [];
        this.SegmentMap = new Map();
        this.buds = [];
        this.leaves = [];
        this.nebariRoots = [];
        this.pellets = [];
        this.fallingClips = [];
        this.undoStack = [];
        this.simDays = 1;
        this.nextId = 1;
        this.initTrunkAndDormantBuds();
      }

      initTrunkAndDormantBuds() {
        const rng = this.rng;
        this.segments = [];
        this.SegmentMap.clear();
        this.buds = [];
        this.leaves = [];
        this.nebariRoots = [];
        this.pellets = [];

        // 1. Nebari Surface Root Flare (gripping the moss mound)
        const numRoots = 8 + Math.floor(rng() * 3);
        for (let i = 0; i < numRoots; i++) {
          const frac = (i / (numRoots - 1)) * 2 - 1;
          const angle = frac * 1.35 + (rng() - 0.5) * 0.15;
          const len = 34 + Math.abs(frac) * 20 + rng() * 14;
          this.nebariRoots.push({
            x0: frac * 10, y0: 2, z0: (rng() - 0.5) * 8,
            x1: Math.sin(angle) * len, y1: -5 - rng() * 4, z1: Math.cos(angle) * 14,
            r0: 9.5 - Math.abs(frac) * 3.0,
            r1: 2.2
          });
        }

        // White Tamahi Organic Fertilizer Cakes on the soil rim (Photos 1, 2, 3, 5)
        const pelletX = [-82, -54, -25, 48, 78];
        for (const px of pelletX) {
          this.pellets.push({
            x: px + (rng() - 0.5) * 8,
            y: -2.5,
            z: 8 + (rng() - 0.5) * 10,
            rx: 8.5 + rng() * 2.0,
            ry: 4.2 + rng() * 1.0
          });
        }

        // 2. Muscular Chopped Woody Trunk Base (Tachiagari + 3-4 Chopped Trunk Heads like Photo 2 & 4)
        const baseRadius = 22.0 + rng() * 4.0;
        const leanX = (rng() - 0.5) * 12;

        const trunkBase = this.createSegment({
          parentId: null,
          type: 'TRUNK',
          x0: 0, y0: -2, z0: 0,
          x1: leanX, y1: 38 + rng() * 8, z1: 0,
          r0: baseRadius,
          r1: baseRadius * 0.78,
          woodiness: 1.0,
          generation: 0,
          curT: 1.0,
          hasChopScar: true,
          scarStyle: 'DARK_PASTE'
        });

        // 3 to 4 Muscular Sub-Trunks (Chopped Woody Pillars from previous years' training)
        const numHeads = 3 + (rng() > 0.45 ? 1 : 0);
        const spreadAngles = numHeads === 4
          ? [-0.56, -0.18, 0.16, 0.52]
          : [-0.46, -0.02, 0.44];

        for (let h = 0; h < numHeads; h++) {
          const ang = spreadAngles[h] + (rng() - 0.5) * 0.15;
          const isCenter = Math.abs(ang) < 0.24;
          const len = (isCenter ? 42 : 32) + rng() * 12;
          const startX = trunkBase.x1 + ang * 16;
          const startY = trunkBase.y1 - Math.abs(ang) * 8;
          const startZ = (h % 2 === 0 ? 1 : -1) * 4;

          const endX = startX + Math.sin(ang) * len;
          const endY = startY + Math.cos(ang) * len;
          const endZ = startZ + (rng() - 0.5) * 8;
          const headR = (isCenter ? 11.5 : 9.0) + rng() * 2.0;

          const headSeg = this.createSegment({
            parentId: trunkBase.id,
            type: 'TRUNK_HEAD',
            x0: startX, y0: startY, z0: startZ,
            x1: endX, y1: endY, z1: endZ,
            r0: headR,
            r1: headR * 0.80,
            woodiness: 0.96,
            generation: 0,
            curT: 1.0,
            hasChopScar: true,
            scarStyle: h === 0 ? 'DARK_PASTE' : 'CALLUS_BEVEL'
          });

          // Create 3-4 Buds around the collar & sides of each chopped trunk head!
          // 2 buds start ACTIVE (sprouting in March 3月), while 2 start DORMANT (waiting in reserve if you prune!)
          const budOffsets = [-0.52, 0.05, 0.52, (rng() > 0.5 ? -0.82 : 0.82)];
          for (let b = 0; b < budOffsets.length; b++) {
            const bAng = ang * 0.75 + budOffsets[b] + (rng() - 0.5) * 0.14;
            const attachFrac = b < 2 ? 0.92 : (0.55 + rng() * 0.3);
            const bx = startX + (endX - startX) * attachFrac + Math.sin(bAng) * (headR * 0.65);
            const by = startY + (endY - startY) * attachFrac;
            const bz = startZ + (endZ - startZ) * attachFrac + (rng() - 0.5) * 6;

            const isInitiallyActive = (b < 2);
            this.buds.push({
              id: `BUD_${this.nextId++}`,
              parentSegId: headSeg.id,
              attachFrac,
              type: isInitiallyActive ? 'COLLAR_ACTIVE' : 'LATENT_TRUNK',
              state: isInitiallyActive ? 'SWELLING' : 'DORMANT',
              swell: isInitiallyActive ? (0.4 + rng() * 0.5) : 0.15,
              x: bx, y: by, z: bz,
              dirAngle: bAng, // Angle from vertical (+Y is up in 3D world)
              dirZ: (rng() - 0.5) * 0.35,
              generation: 1,
              remainingInternodes: 3 + Math.floor(rng() * 2),
              hasWire: (h === numHeads - 1 && b === 1)
            });
          }
        }
      }

      createSegment(cfg) {
        const seg = {
          id: `SEG_${this.nextId++}`,
          parentId: cfg.parentId || null,
          type: cfg.type || 'INTERNODE', // 'TRUNK' | 'TRUNK_HEAD' | 'INTERNODE'
          x0: cfg.x0, y0: cfg.y0, z0: cfg.z0 || 0,
          x1: cfg.x1, y1: cfg.y1, z1: cfg.z1 || 0,
          r0: cfg.r0 || 2.0,
          r1: cfg.r1 || 1.6,
          woodiness: cfg.woodiness !== undefined ? cfg.woodiness : 0.0,
          generation: cfg.generation || 1,
          internodeIdx: cfg.internodeIdx || 0,
          curT: cfg.curT !== undefined ? cfg.curT : 0.02, // Elongation 0.0 -> 1.0
          dirAngle: cfg.dirAngle || 0,
          dirZ: cfg.dirZ || 0,
          remainingInternodes: cfg.remainingInternodes || 0,
          hasNodeFormed: cfg.curT >= 1.0,
          hasChopScar: cfg.hasChopScar || false,
          scarStyle: cfg.scarStyle || null,
          hasWire: cfg.hasWire || false,
          auxin: 0,
          pruned: false,
          childrenIds: [],
          nodeBudIds: [],
          nodeLeafIds: []
        };
        this.segments.push(seg);
        this.SegmentMap.set(seg.id, seg);
        if (seg.parentId && this.SegmentMap.has(seg.parentId)) {
          this.SegmentMap.get(seg.parentId).childrenIds.push(seg.id);
        }
        return seg;
      }

      /*
       * Main Causal Biological Simulation Tick (runs every frame when not paused).
       * Replicates:
       * 1. Apical Dominance (Auxin downward diffusion)
       * 2. Sap Vigor & Dormant Bud Awakening (Compensation when branches are pruned)
       * 3. Bud Swelling & Shoot Meristem Elongation
       * 4. Opposite Phyllotaxy Leaf Emergence & Expansion (3月 Bronze -> 6月 Emerald)
       * 5. Pipe-Model Secondary Trunk/Branch Thickening
       */
      stepBiology(dt) {
        const rng = this.rng;
        this.simDays += dt * 4.5;

        // 1. Reset Auxin & Compute Apical Dominance
        for (const seg of this.segments) {
          seg.auxin = 0;
        }

        let activeMeristemCount = 0;
        for (const seg of this.segments) {
          if (seg.pruned) continue;
          if (seg.type === 'INTERNODE' && seg.curT < 1.0) {
            activeMeristemCount++;
            this.propagateAuxinDown(seg.id, 1.0);
          }
        }
        for (const bud of this.buds) {
          if (bud.pruned || bud.state === 'SPENT') continue;
          if (bud.state === 'SWELLING') {
            activeMeristemCount++;
            this.propagateAuxinDown(bud.parentSegId, 0.85);
          }
        }

        // 2. Sap Vigor Redistribution & Natural Bud Awakening:
        // If active meristems are low (e.g., because the user pruned branches!),
        // root pressure + stored sap immediately wakes up dormant buds on low-auxin segments!
        const targetActiveMeristems = 7;
        if (activeMeristemCount < targetActiveMeristems) {
          const candidates = this.buds.filter(b => {
            if (b.pruned || b.state !== 'DORMANT') return false;
            const pSeg = this.SegmentMap.get(b.parentSegId);
            if (!pSeg || pSeg.pruned || pSeg.curT < 0.95) return false;
            return pSeg.auxin < 0.35; // Free from apical dominance!
          });

          // Prioritize buds right below a pruning cut (hasChopScar) or higher generation nodes, plus trunk back-buds!
          candidates.sort((a, b) => {
            const segA = this.SegmentMap.get(a.parentSegId);
            const segB = this.SegmentMap.get(b.parentSegId);
            const scoreA = (segA.hasChopScar ? 3.0 : 0) + segA.generation * 0.4 + rng() * 0.8;
            const scoreB = (segB.hasChopScar ? 3.0 : 0) + segB.generation * 0.4 + rng() * 0.8;
            return scoreB - scoreA;
          });

          const toWake = Math.min(candidates.length, targetActiveMeristems - activeMeristemCount);
          for (let i = 0; i < toWake; i++) {
            candidates[i].state = 'SWELLING';
          }
        }

        // 3. Advance Swelling Buds -> Burst into New Internode Shoots!
        for (const bud of this.buds) {
          if (bud.pruned || bud.state !== 'SWELLING') continue;
          const pSeg = this.SegmentMap.get(bud.parentSegId);
          if (!pSeg || pSeg.pruned) {
            bud.pruned = true;
            continue;
          }

          bud.swell += dt * 0.85;
          if (bud.swell >= 1.0) {
            bud.state = 'SPENT';
            this.sproutInternodeFromBud(bud, pSeg);
          }
        }

        // 4. Elongate Active Internode Shoots & Form Opposite Nodes (Leaves + Axillary Buds)
        for (const seg of this.segments) {
          if (seg.pruned || seg.type !== 'INTERNODE') continue;

          // Keep segment base locked to parent tip
          if (seg.parentId && this.SegmentMap.has(seg.parentId)) {
            const pSeg = this.SegmentMap.get(seg.parentId);
            if (pSeg.type === 'INTERNODE') {
              const dx = pSeg.x1 - seg.x0;
              const dy = pSeg.y1 - seg.y0;
              const dz = pSeg.z1 - seg.z0;
              seg.x0 += dx; seg.y0 += dy; seg.z0 += dz;
              seg.x1 += dx; seg.y1 += dy; seg.z1 += dz;
            }
          }

          if (seg.curT < 1.0) {
            seg.curT = Math.min(1.0, seg.curT + dt * 0.72);
            if (seg.curT >= 1.0 && !seg.hasNodeFormed) {
              seg.hasNodeFormed = true;
              this.formOppositeNodeAtTip(seg);
            }
          }
        }

        // 5. Expand Leaves (3月 Bronze-Red -> 6月 Lush Emerald) & Pipe-Model Wood Thickening
        for (const lf of this.leaves) {
          if (lf.pruned) continue;
          const pSeg = this.SegmentMap.get(lf.parentSegId);
          if (!pSeg || pSeg.pruned) {
            lf.pruned = true;
            continue;
          }

          // Anchor leaf to its node on the parent segment
          lf.x = pSeg.x0 + (pSeg.x1 - pSeg.x0) * lf.attachT;
          lf.y = pSeg.y0 + (pSeg.y1 - pSeg.y0) * lf.attachT;
          lf.z = pSeg.z0 + (pSeg.z1 - pSeg.z0) * lf.attachT;

          // Leaf growth ontogeny
          if (lf.age < 1.0) {
            lf.age = Math.min(1.0, lf.age + dt * 0.28);
          }

          // Pipe Model: This leaf photosynthesizes and thickens every ancestral segment down to the trunk!
          const sapContribution = (0.2 + 0.8 * lf.age) * dt * 0.014;
          this.thickenAncestorPath(lf.parentSegId, sapContribution);
        }
      }

      propagateAuxinDown(segId, amount) {
        let curId = segId;
        let curAux = amount;
        while (curId && curAux > 0.05) {
          const seg = this.SegmentMap.get(curId);
          if (!seg || seg.pruned) break;
          seg.auxin += curAux;
          curId = seg.parentId;
          curAux *= 0.68;
        }
      }

      thickenAncestorPath(segId, sapDelta) {
        let curId = segId;
        let factor = 1.0;
        while (curId) {
          const seg = this.SegmentMap.get(curId);
          if (!seg || seg.pruned) break;
          const maxR = seg.type === 'TRUNK' ? 42.0 : (seg.type === 'TRUNK_HEAD' ? 22.0 : 12.0);
          if (seg.r0 < maxR) {
            seg.r0 += sapDelta * factor;
            seg.r1 = Math.max(1.0, seg.r1 + sapDelta * factor * 0.82);
          }
          if (seg.type === 'INTERNODE') {
            seg.woodiness = Math.min(0.95, seg.woodiness + sapDelta * 0.85);
          }
          curId = seg.parentId;
          factor *= 1.08; // Trunk base accumulates the sum of all upper pipes!
        }
      }

      sproutInternodeFromBud(bud, parentSeg) {
        const rng = this.rng;
        const gen = bud.generation || 1;
        // Shorter internodes as ramification generation increases (authentic bonsai refinement!)
        const len = (25 + rng() * 11) * Math.pow(0.84, Math.max(0, gen - 1));
        // Gentle phototropic curve upward
        const angle = bud.dirAngle * 0.92 + (rng() - 0.5) * 0.16;
        const endX = bud.x + Math.sin(angle) * len;
        const endY = bud.y + Math.cos(angle) * len;
        const endZ = bud.z + Math.sin(bud.dirZ) * (len * 0.35);

        const startR = Math.max(1.15, Math.min(2.4, parentSeg.r1 * 0.65));

        this.createSegment({
          parentId: parentSeg.id,
          type: 'INTERNODE',
          x0: bud.x, y0: bud.y, z0: bud.z,
          x1: endX, y1: endY, z1: endZ,
          r0: startR,
          r1: Math.max(0.95, startR * 0.84),
          woodiness: 0.05,
          generation: gen,
          internodeIdx: 0,
          curT: 0.05,
          dirAngle: angle,
          dirZ: bud.dirZ,
          remainingInternodes: bud.remainingInternodes - 1,
          hasWire: bud.hasWire
        });
      }

      /*
       * Called the instant an internode reaches full length (curT == 1.0):
       * Creates:
       * 1. A pair of Opposite Palmate Maple Leaves (Filotaxis Opuesta)
       * 2. A pair of Opposite Dormant Axillary Buds (ready to bifurcate in a Y if pruned!)
       * 3. Continuation of the Apical Meristem if remainingInternodes > 0
       */
      formOppositeNodeAtTip(seg) {
        const rng = this.rng;
        const isTerminal = (seg.remainingInternodes <= 0);
        // Smaller, more refined leaves on higher ramification generations
        const ramScale = Math.pow(0.85, Math.max(0, seg.generation - 1));

        // 1. Spawn Opposite Pair of Leaves + Opposite Axillary Buds
        const sides = [-1, 1];
        for (const side of sides) {
          const leafAngle = seg.dirAngle + side * (0.68 + rng() * 0.28);
          const leafId = `LF_${this.nextId++}`;
          this.leaves.push({
            id: leafId,
            parentSegId: seg.id,
            attachT: 0.98,
            x: seg.x1, y: seg.y1, z: seg.z1,
            side,
            angle: leafAngle,
            tiltZ: side * 0.25 + (rng() - 0.5) * 0.3,
            maxRadius: (isTerminal ? (18 + rng() * 6) : (24 + rng() * 9)) * ramScale,
            petioleLen: (isTerminal ? (9 + rng() * 4) : (13 + rng() * 6)) * ramScale,
            age: 0.04, // Starts as tiny folded bronze-red March leaf (3月)!
            shadeLayer: 0.45 + rng() * 0.55,
            hueOffset: (rng() - 0.5) * 14,
            pruned: false
          });
          seg.nodeLeafIds.push(leafId);

          // Opposite Axillary Bud sitting in the leaf axil
          const budAngle = seg.dirAngle + side * (0.48 + rng() * 0.16);
          const axBud = {
            id: `BUD_${this.nextId++}`,
            parentSegId: seg.id,
            attachFrac: 0.98,
            type: 'AXILLARY',
            state: 'DORMANT', // Kept asleep by apical dominance until you prune above it!
            swell: 0.2,
            x: seg.x1 + side * (seg.r1 * 0.9),
            y: seg.y1,
            z: seg.z1 + side * 1.5,
            dirAngle: budAngle,
            dirZ: seg.dirZ + (rng() - 0.5) * 0.3,
            generation: seg.generation + 1,
            remainingInternodes: 2 + (rng() > 0.5 ? 1 : 0),
            hasWire: false,
            pruned: false
          };
          this.buds.push(axBud);
          seg.nodeBudIds.push(axBud.id);
        }

        // 2. If apical meristem still has momentum, continue elongating into the next internode!
        if (seg.remainingInternodes > 0) {
          const nextLen = (23 + rng() * 10) * Math.pow(0.85, Math.max(0, seg.generation - 1));
          const nextAng = seg.dirAngle + (rng() - 0.5) * 0.20;
          const endX = seg.x1 + Math.sin(nextAng) * nextLen;
          const endY = seg.y1 + Math.cos(nextAng) * nextLen;
          const endZ = seg.z1 + Math.sin(seg.dirZ) * (nextLen * 0.3);

          this.createSegment({
            parentId: seg.id,
            type: 'INTERNODE',
            x0: seg.x1, y0: seg.y1, z0: seg.z1,
            x1: endX, y1: endY, z1: endZ,
            r0: seg.r1,
            r1: Math.max(0.9, seg.r1 * 0.85),
            woodiness: 0.0,
            generation: seg.generation,
            internodeIdx: seg.internodeIdx + 1,
            curT: 0.02,
            dirAngle: nextAng,
            dirZ: seg.dirZ,
            remainingInternodes: seg.remainingInternodes - 1,
            hasWire: seg.hasWire && seg.internodeIdx < 2
          });
        }
      }

      /*
       * Prunes a segment and all its descendants (`✂️ PODAR RAMA`):
       * - Severs the branch/shoot from that internode outward.
       * - Leaves a fresh green-white cambium cut scar on the parent stub (Photo 4!).
       * - IMMEDIATELY awakens the opposite axillary buds on the parent stub AND
       *   stimulates dormant buds elsewhere on the tree to compensate for the lost foliage!
       */
      pruneSegment(segId) {
        const seg = this.SegmentMap.get(segId);
        if (!seg || seg.pruned || seg.type === 'TRUNK' || seg.type === 'TRUNK_HEAD') return false;

        const descSegIds = [];
        this.collectDescendants(segId, descSegIds);

        const affectedBuds = [];
        const affectedLeaves = [];
        const parentSeg = seg.parentId ? this.SegmentMap.get(seg.parentId) : null;

        for (const id of descSegIds) {
          const s = this.SegmentMap.get(id);
          if (!s || s.pruned) continue;
          s.pruned = true;

          // Add falling clipping particle
          this.fallingClips.push({
            x: (s.x0 + s.x1) * 0.5,
            y: (s.y0 + s.y1) * 0.5,
            z: s.z1,
            vx: (Math.random() - 0.5) * 1.5,
            vy: -0.5,
            r: 8.0,
            alpha: 1.0
          });

          for (const b of this.buds) {
            if (b.parentSegId === id && !b.pruned) {
              b.pruned = true;
              affectedBuds.push(b.id);
            }
          }
          for (const l of this.leaves) {
            if (l.parentSegId === id && !l.pruned) {
              l.pruned = true;
              affectedLeaves.push(l.id);
            }
          }
        }

        const wokeBudIds = [];
        if (parentSeg) {
          const prevScar = parentSeg.hasChopScar;
          const prevStyle = parentSeg.scarStyle;
          parentSeg.hasChopScar = true;
          parentSeg.scarStyle = 'FRESH_GREEN_CUT';

          // 1. Wake up BOTH opposite axillary buds at the tip of parentSeg (True Maple Y-Bifurcation!)
          for (const b of this.buds) {
            if (b.parentSegId === parentSeg.id && !b.pruned && b.state === 'DORMANT') {
              b.state = 'SWELLING';
              b.swell = Math.max(b.swell, 0.35);
              wokeBudIds.push(b.id);
            }
          }

          // 2. If parentSeg had no dormant buds (e.g., cut right at the trunk head),
          // wake up 2 dormant buds on the trunk or other branches (Back-budding / Brotación compensatoria!)
          if (wokeBudIds.length < 2) {
            const extraBuds = this.buds.filter(b => !b.pruned && b.state === 'DORMANT');
            extraBuds.sort(() => this.rng() - 0.5);
            for (let i = 0; i < Math.min(2, extraBuds.length); i++) {
              extraBuds[i].state = 'SWELLING';
              extraBuds[i].swell = 0.35;
              wokeBudIds.push(extraBuds[i].id);
            }

            // Also spawn a fresh adventitious bud right at the collar of the cut if cut near the trunk!
            if (parentSeg.type === 'TRUNK_HEAD') {
              for (const side of [-1, 1]) {
                const newBud = {
                  id: `BUD_${this.nextId++}`,
                  parentSegId: parentSeg.id,
                  attachFrac: 0.90,
                  type: 'ADVENTITIOUS',
                  state: 'SWELLING',
                  swell: 0.30,
                  x: seg.x0 + side * 4.5,
                  y: seg.y0 - 2.0,
                  z: seg.z0,
                  dirAngle: seg.dirAngle + side * (0.45 + this.rng() * 0.25),
                  dirZ: (this.rng() - 0.5) * 0.3,
                  generation: 1,
                  remainingInternodes: 3,
                  hasWire: false,
                  pruned: false
                };
                this.buds.push(newBud);
                wokeBudIds.push(newBud.id);
              }
            }
          }

          this.undoStack.push({
            descSegIds,
            affectedBuds,
            affectedLeaves,
            wokeBudIds,
            parentId: parentSeg.id,
            prevScar,
            prevStyle
          });
        }

        return true;
      }

      /*
       * Pinches an apical shoot tip or manually awakens a dormant bud (`🤏 PINZAR / ACTIVAR YEMA`)
       */
      pinchOrWakeBud(segId) {
        const seg = this.SegmentMap.get(segId);
        if (!seg || seg.pruned) return false;

        // Wake any dormant axillary buds on this segment and stop further apical elongation
        seg.remainingInternodes = 0;
        let wokeAny = false;
        for (const b of this.buds) {
          if (b.parentSegId === seg.id && !b.pruned && b.state === 'DORMANT') {
            b.state = 'SWELLING';
            b.swell = 0.45;
            wokeAny = true;
          }
        }
        // Or defoliate large leaves on this node to let light into interior buds
        for (const l of this.leaves) {
          if (l.parentSegId === seg.id && !l.pruned && l.age > 0.6) {
            l.pruned = true;
            wokeAny = true;
          }
        }
        return wokeAny;
      }

      burstSpringFlush() {
        // Awaken up to 4 dormant buds across the tree and boost growth
        const dormant = this.buds.filter(b => !b.pruned && b.state === 'DORMANT');
        dormant.sort(() => this.rng() - 0.5);
        for (let i = 0; i < Math.min(4, dormant.length); i++) {
          dormant[i].state = 'SWELLING';
          dormant[i].swell = 0.5;
        }
        for (let step = 0; step < 35; step++) {
          this.stepBiology(0.05);
        }
      }

      collectDescendants(segId, out) {
        out.push(segId);
        const seg = this.SegmentMap.get(segId);
        if (seg) {
          for (const cid of seg.childrenIds) {
            this.collectDescendants(cid, out);
          }
        }
      }

      undo() {
        if (this.undoStack.length === 0) return false;
        const last = this.undoStack.pop();
        for (const id of last.descSegIds) {
          const s = this.SegmentMap.get(id);
          if (s) s.pruned = false;
        }
        for (const bid of last.affectedBuds) {
          const b = this.buds.find(x => x.id === bid);
          if (b) b.pruned = false;
        }
        for (const lid of last.affectedLeaves) {
          const l = this.leaves.find(x => x.id === lid);
          if (l) l.pruned = false;
        }
        for (const bid of last.wokeBudIds) {
          const b = this.buds.find(x => x.id === bid);
          if (b && b.state === 'SWELLING') b.state = 'DORMANT';
        }
        if (last.parentId && this.SegmentMap.has(last.parentId)) {
          const p = this.SegmentMap.get(last.parentId);
          p.hasChopScar = last.prevScar;
          p.scarStyle = last.prevStyle;
        }
        return true;
      }
    }

    let bonsai = new LivingBonsaiOrganism(currentSeed, currentSpecies);
    // Pre-grow initial spring canopy so user sees lush maple shoots & buds right away
    for (let i = 0; i < 85; i++) {
      bonsai.stepBiology(0.05);
    }

    /* ====================================================================
       3. THREE.JS WEBGL GPU ASCII PROJECTION ENGINE (60-120 FPS)
       ====================================================================
       Architecture:
       1. A 3D Three.js Scene with InstancedMesh pools for:
          - Tapered 3D Cylinders (Trunk, Chopped Heads, Internode Stems, Petioles, Roots)
          - 3D 5-Lobed Serrated Maple Leaf Geometry (Acer palmatum palmate star with veins)
          - 3D Buds, Callus Scars & Tamahi Fertilizer Cakes
       2. Rendered via an OrthographicCamera (planar projection) into a WebGLRenderTarget.
       3. A Fullscreen WebGL Fragment Shader samples a High-Res ASCII Glyph Atlas Texture
          and projects the 3D scene into razor-sharp, glowing ASCII characters on the GPU!
    */

    const container = document.getElementById('canvasContainer');
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // 1. Create High-Resolution 16x2 ASCII Glyph Atlas Texture (32 glyphs at 64x64px each)
    function createAsciiFontAtlas() {
      const atlasCanvas = document.createElement('canvas');
      atlasCanvas.width = 1024;
      atlasCanvas.height = 128;
      const c = atlasCanvas.getContext('2d');
      c.fillStyle = '#000000';
      c.fillRect(0, 0, atlasCanvas.width, atlasCanvas.height);

      // Row 0 (index 0..15): Density ramp from empty to solid botanical glyphs
      // Row 1 (index 16..31): Directional contour & vein glyphs
      const glyphs = [
        ' ', '.', '·', ':', ';', '-', '=', '+', '*', 'o', '4', '6', '8', '0', '%', '#',
        '(', ')', '/', '\\', '|', '¦', '_', '~', '^', 'v', '@', '!', 'x', 'w', '#', '@'
      ];

      c.font = 'bold 46px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillStyle = '#ffffff';

      for (let i = 0; i < 32; i++) {
        const col = i % 16;
        const row = Math.floor(i / 16);
        const cx = col * 64 + 32;
        const cy = row * 64 + 34;
        c.fillText(glyphs[i], cx, cy);
      }

      const tex = new THREE.CanvasTexture(atlasCanvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      return tex;
    }

    // 2. Build 3D Botanical Scene & Orthographic Planar Camera
    const bioScene = new THREE.Scene();
    bioScene.background = new THREE.Color(0x000000);

    let viewW = window.innerWidth;
    let viewH = window.innerHeight;
    let worldScale = 1.0;

    const orthoCamera = new THREE.OrthographicCamera(-300, 300, 350, -90, -500, 500);
    orthoCamera.position.set(0, 0, 200);
    orthoCamera.lookAt(0, 0, 0);

    // Lighting for 3D cylindrical bark & leaf shading
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.52);
    bioScene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff8e7, 0.95);
    sunLight.position.set(-140, 220, 180);
    bioScene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x50e3c2, 0.32);
    rimLight.position.set(160, 80, -100);
    bioScene.add(rimLight);

    // 3. Create Custom 5-Lobed Palmate Maple Leaf 3D BufferGeometry (Acer palmatum)
    function createPalmateMapleLeafGeometry() {
      const positions = [];
      const normals = [];
      const colors = [];

      // 5 radiating lobes of a Japanese Maple leaf: Basal L/R, Lateral L/R, Central
      const lobes = [
        { ang: -1.40, len: 0.56, wid: 0.20 },
        { ang:  1.40, len: 0.56, wid: 0.20 },
        { ang: -0.70, len: 0.86, wid: 0.25 },
        { ang:  0.70, len: 0.86, wid: 0.25 },
        { ang:  0.00, len: 1.00, wid: 0.27 }
      ];

      for (const lobe of lobes) {
        const steps = 6;
        const cosA = Math.cos(lobe.ang);
        const sinA = Math.sin(lobe.ang);

        for (let s = 0; s < steps; s++) {
          const u0 = s / steps;
          const u1 = (s + 1) / steps;

          // Serrated sawtooth width profile
          const tooth0 = 1.0 + (s % 2 === 1 ? 0.22 : -0.08);
          const tooth1 = 1.0 + ((s + 1) % 2 === 1 ? 0.22 : -0.08);
          const w0 = lobe.wid * Math.sin(Math.pow(u0, 0.65) * Math.PI) * tooth0;
          const w1 = lobe.wid * Math.sin(Math.pow(u1, 0.65) * Math.PI) * tooth1;

          const l0 = u0 * lobe.len;
          const l1 = u1 * lobe.len;

          const toWorld = (localL, localW, zHeight) => {
            const x = localL * sinA + localW * cosA;
            const y = localL * cosA - localW * sinA;
            return [x, y, zHeight];
          };

          // Central vein ridge is slightly elevated in Z for 3D normal contrast
          const c0 = toWorld(l0, 0, 0.08);
          const c1 = toWorld(l1, 0, 0.08);
          const left0 = toWorld(l0, -w0, 0.0);
          const left1 = toWorld(l1, -w1, 0.0);
          const right0 = toWorld(l0, w0, 0.0);
          const right1 = toWorld(l1, w1, 0.0);

          const pushTri = (pA, pB, pC, cA, cB, cC, nZ) => {
            positions.push(...pA, ...pB, ...pC);
            normals.push(0, 0.25, nZ, 0, 0.25, nZ, 0, 0.25, nZ);
            colors.push(...cA, ...cB, ...cC);
          };

          const veinCol = [1.32, 1.38, 1.15]; // Bright midrib vein highlight
          const bodyCol = [0.92, 0.96, 0.90];
          const edgeCol = [1.12, 1.18, 1.05];

          // Left half of lobe segment
          pushTri(c0, left0, c1, veinCol, edgeCol, veinCol, 0.95);
          pushTri(left0, left1, c1, edgeCol, edgeCol, veinCol, 0.95);
          // Right half of lobe segment
          pushTri(c0, c1, right0, veinCol, veinCol, edgeCol, 0.85);
          pushTri(right0, c1, right1, edgeCol, veinCol, edgeCol, 0.85);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return geom;
    }

    // 4. InstancedMesh Pools (Zero per-frame allocations!)
    const MAX_CYLINDERS = 1500;
    const MAX_SPHERES = 1000;
    const MAX_LEAVES = 1500;

    const cylGeom = new THREE.CylinderGeometry(0.82, 1.0, 1.0, 8, 1);
    const cylMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const cylInstanced = new THREE.InstancedMesh(cylGeom, cylMat, MAX_CYLINDERS);
    cylInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bioScene.add(cylInstanced);

    const sphereGeom = new THREE.SphereGeometry(1.0, 8, 6);
    const sphereMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const sphereInstanced = new THREE.InstancedMesh(sphereGeom, sphereMat, MAX_SPHERES);
    sphereInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bioScene.add(sphereInstanced);

    const mapleLeafGeom = createPalmateMapleLeafGeometry();
    const mapleLeafMat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, side: THREE.DoubleSide });
    const leafInstanced = new THREE.InstancedMesh(mapleLeafGeom, mapleLeafMat, MAX_LEAVES);
    leafInstanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bioScene.add(leafInstanced);

    // 5. Static Pot & Moss Mound Meshes in the 3D Scene
    const potGroup = new THREE.Group();
    bioScene.add(potGroup);

    function buildPotAndMossMeshes() {
      // Domed green moss mound on top of pot
      const mossGeom = new THREE.CylinderGeometry(96, 102, 10, 24, 1);
      const mossMat = new THREE.MeshLambertMaterial({ color: 0x56a84c });
      const mossMesh = new THREE.Mesh(mossGeom, mossMat);
      mossMesh.position.set(0, -4, -5);
      potGroup.add(mossMesh);

      // Terracotta Pot Rim Lip
      const lipGeom = new THREE.CylinderGeometry(108, 106, 6, 24, 1);
      const lipMat = new THREE.MeshLambertMaterial({ color: 0xd48866 });
      const lipMesh = new THREE.Mesh(lipGeom, lipMat);
      lipMesh.position.set(0, -9, 0);
      potGroup.add(lipMesh);

      // Terracotta Pot Body
      const bodyGeom = new THREE.CylinderGeometry(102, 84, 38, 24, 1);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xb26244 });
      const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
      bodyMesh.position.set(0, -29, 0);
      potGroup.add(bodyMesh);

      // Pot Feet (Left & Right)
      const footGeom = new THREE.BoxGeometry(24, 6, 30);
      const footMat = new THREE.MeshLambertMaterial({ color: 0x8a4830 });
      const leftFoot = new THREE.Mesh(footGeom, footMat);
      leftFoot.position.set(-64, -50, 0);
      const rightFoot = new THREE.Mesh(footGeom, footMat);
      rightFoot.position.set(64, -50, 0);
      potGroup.add(leftFoot, rightFoot);
    }
    buildPotAndMossMeshes();

    // 6. Fullscreen WebGL Post-Processing ASCII Shader Pass
    let sceneRT = new THREE.WebGLRenderTarget(512, 512, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat
    });

    const asciiAtlasTex = createAsciiFontAtlas();

    const asciiPostScene = new THREE.Scene();
    const asciiPostCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const asciiShaderMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: sceneRT.texture },
        tAscii: { value: asciiAtlasTex },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uCellSize: { value: new THREE.Vector2(6.5, 8.5) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform sampler2D tScene;
        uniform sampler2D tAscii;
        uniform vec2 uResolution;
        uniform vec2 uCellSize;
        varying vec2 vUv;

        float getLuma(vec3 c) {
          return dot(c, vec3(0.299, 0.587, 0.114));
        }

        void main() {
          vec2 pixelPos = vUv * uResolution;
          vec2 cellIndex = floor(pixelPos / uCellSize);
          vec2 cellFract = fract(pixelPos / uCellSize);
          vec2 cellCenterUV = (cellIndex + 0.5) * uCellSize / uResolution;

          vec4 centerSample = texture2D(tScene, cellCenterUV);
          float luma = getLuma(centerSample.rgb);

          // Pure dark background outside the specimen
          if (luma < 0.025) {
            gl_FragColor = vec4(0.008, 0.012, 0.02, 1.0);
            return;
          }

          // Sample neighbor cells to detect silhouette edges, bark contours & leaf veins
          vec2 stepUV = uCellSize / uResolution;
          float lL = getLuma(texture2D(tScene, cellCenterUV + vec2(-stepUV.x, 0.0)).rgb);
          float lR = getLuma(texture2D(tScene, cellCenterUV + vec2( stepUV.x, 0.0)).rgb);
          float lU = getLuma(texture2D(tScene, cellCenterUV + vec2(0.0,  stepUV.y)).rgb);
          float lD = getLuma(texture2D(tScene, cellCenterUV + vec2(0.0, -stepUV.y)).rgb);

          float gx = lR - lL;
          float gy = lU - lD;
          float edgeMag = sqrt(gx * gx + gy * gy);

          float glyphCol = 0.0;
          float glyphRow = 0.0; // Row 0 in UV (top row is y in [0.5, 1.0] in WebGL CanvasTexture)

          // Deterministic cell hash for organic ASCII character variety
          float cellHash = fract(sin(dot(cellIndex, vec2(12.9898, 78.233))) * 43758.5453);

          if (edgeMag > 0.24) {
            // Directional contour / vein glyph (Row 1)
            glyphRow = 1.0;
            if (abs(gx) > abs(gy) * 1.4) {
              glyphCol = gx > 0.0 ? 0.0 : 1.0; // '(' or ')'
            } else if (abs(gy) > abs(gx) * 1.4) {
              glyphCol = 6.0; // '_' / '-'
            } else {
              glyphCol = (gx * gy > 0.0) ? 2.0 : 3.0; // '/' or '\\'
            }
          } else {
            // Density ramp glyph (Row 0: 1..15)
            glyphRow = 0.0;
            float variedLuma = clamp(luma * 1.15 + (cellHash - 0.5) * 0.16, 0.08, 0.99);
            glyphCol = floor(variedLuma * 15.0);
          }

          // Sample crisp glyph from the 16x2 Atlas Texture
          // Note: CanvasTexture row 0 is at top (v in 0.5..1.0), row 1 is at bottom (v in 0.0..0.5)
          float u = (glyphCol + cellFract.x) / 16.0;
          float v = (glyphRow < 0.5)
            ? (0.5 + (1.0 - cellFract.y) * 0.5)
            : ((1.0 - cellFract.y) * 0.5);

          float mask = texture2D(tAscii, vec2(u, v)).r;

          // Boost color saturation & subtle phosphor glow
          vec3 boostedColor = centerSample.rgb * (1.22 + luma * 0.25);
          vec3 bg = vec3(0.008, 0.012, 0.02);
          vec3 finalCol = mix(bg, boostedColor, mask);

          gl_FragColor = vec4(finalCol, 1.0);
        }
      `
    });

    const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), asciiShaderMat);
    asciiPostScene.add(quadMesh);

    function updateCameraAndSize() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      renderer.setSize(viewW, viewH);

      // Maintain aspect ratio in Orthographic world space, anchored near bottom pot
      const aspect = viewW / Math.max(1, viewH);
      const frustumH = 380;
      const frustumW = frustumH * aspect;

      orthoCamera.left = -frustumW / 2;
      orthoCamera.right = frustumW / 2;
      orthoCamera.top = frustumH * 0.78;
      orthoCamera.bottom = -frustumH * 0.22;
      orthoCamera.updateProjectionMatrix();

      // Low-res render target sized at 2x character grid for fast supersampled sampling
      const rtW = Math.max(256, Math.floor(viewW / 2.5));
      const rtH = Math.max(256, Math.floor(viewH / 2.5));
      sceneRT.setSize(rtW, rtH);

      asciiShaderMat.uniforms.uResolution.value.set(viewW, viewH);
    }
    window.addEventListener('resize', updateCameraAndSize);
    updateCameraAndSize();

    /* ====================================================================
       4. SYNC BIOLOGICAL STATE TO THREE.JS INSTANCED MESHES (< 0.3ms/frame)
       ==================================================================== */
    const dummyObj = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    const upVec = new THREE.Vector3(0, 1, 0);
    const segVec = new THREE.Vector3();
    const midVec = new THREE.Vector3();

    let hoveredSegId = null;
    const hoveredDescSet = new Set();

    function syncBiologyToThreeScene(timeSec) {
      let cylIdx = 0;
      let sphIdx = 0;
      let leafIdx = 0;

      const pushCylinder = (x0, y0, z0, x1, y1, z1, r0, r1, hexOrColor) => {
        if (cylIdx >= MAX_CYLINDERS) return;
        segVec.set(x1 - x0, y1 - y0, z1 - z0);
        const len = segVec.length();
        if (len < 0.1) return;

        midVec.set((x0 + x1) * 0.5, (y0 + y1) * 0.5, (z0 + z1) * 0.5);
        dummyObj.position.copy(midVec);
        dummyObj.quaternion.setFromUnitVectors(upVec, segVec.normalize());
        const avgR = (r0 + r1) * 0.5;
        dummyObj.scale.set(avgR, len, avgR);
        dummyObj.updateMatrix();

        cylInstanced.setMatrixAt(cylIdx, dummyObj.matrix);
        cylInstanced.setColorAt(cylIdx, hexOrColor);
        cylIdx++;
      };

      const pushSphere = (x, y, z, rx, ry, rz, hexOrColor) => {
        if (sphIdx >= MAX_SPHERES) return;
        dummyObj.position.set(x, y, z);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(rx, ry, rz);
        dummyObj.updateMatrix();

        sphereInstanced.setMatrixAt(sphIdx, dummyObj.matrix);
        sphereInstanced.setColorAt(sphIdx, hexOrColor);
        sphIdx++;
      };

      // 1. Nebari Surface Roots
      tmpColor.setRGB(0.68, 0.64, 0.56);
      for (const r of bonsai.nebariRoots) {
        pushCylinder(r.x0, r.y0, r.z0, r.x1, r.y1, r.z1, r.r0, r.r1, tmpColor);
      }

      // 2. White Tamahi Organic Fertilizer Cakes on the Soil Rim
      tmpColor.setRGB(0.88, 0.85, 0.78);
      for (const p of bonsai.pellets) {
        pushSphere(p.x, p.y, p.z, p.rx, p.ry, p.rx, tmpColor);
      }

      // 3. Trunk, Chopped Trunk Heads & Internode Branches
      let activeBranchCount = 0;
      for (const seg of bonsai.segments) {
        if (seg.pruned) continue;

        const curX1 = seg.x0 + (seg.x1 - seg.x0) * seg.curT;
        const curY1 = seg.y0 + (seg.y1 - seg.y0) * seg.curT;
        const curZ1 = seg.z0 + (seg.z1 - seg.z0) * seg.curT;

        const isCutHighlight = hoveredDescSet.has(seg.id);

        if (isCutHighlight) {
          tmpColor.setRGB(1.0, 0.30, 0.40);
        } else if (seg.type === 'TRUNK' || seg.type === 'TRUNK_HEAD') {
          // Aged silver-taupe Japanese Maple bark
          tmpColor.setRGB(0.74, 0.71, 0.64);
        } else {
          activeBranchCount++;
          // Smooth transition from young reddish-green spring shoot to green-woody branch
          const w = seg.woodiness;
          tmpColor.setRGB(
            0.52 * (1 - w) + 0.62 * w,
            0.78 * (1 - w) + 0.68 * w,
            0.40 * (1 - w) + 0.52 * w
          );
        }

        pushCylinder(seg.x0, seg.y0, seg.z0, curX1, curY1, curZ1, seg.r0, seg.r1, tmpColor);

        // Render Chop Scars / Cut Paste / Fresh Green Cut Disc at the top of chopped segments (Photo 2 & 4!)
        if (seg.hasChopScar && seg.curT >= 0.95 && !isCutHighlight) {
          if (seg.scarStyle === 'DARK_PASTE') {
            tmpColor.setRGB(0.38, 0.43, 0.48); // Grey cut-paste seal (Photo 1 & 2)
            pushSphere(curX1, curY1, curZ1 + 2.0, seg.r1 * 0.85, 3.2, seg.r1 * 0.85, tmpColor);
          } else if (seg.scarStyle === 'FRESH_GREEN_CUT') {
            // Fresh green-white cambium ring after summer pruning (Photo 4!)
            tmpColor.setRGB(0.78, 0.95, 0.65);
            pushSphere(curX1, curY1, curZ1 + 2.0, seg.r1 * 1.25, 2.5, seg.r1 * 1.25, tmpColor);
          } else {
            // Callus bevel chop
            tmpColor.setRGB(0.82, 0.78, 0.66);
            pushSphere(curX1, curY1, curZ1 + 1.5, seg.r1 * 0.82, 2.8, seg.r1 * 0.82, tmpColor);
          }
        }

        // Clean cut ring indicator at the base of the hovered segment
        if (hoveredSegId === seg.id) {
          tmpColor.setRGB(1.0, 0.25, 0.45);
          pushSphere(seg.x0, seg.y0, seg.z0 + 4.0, Math.max(3.5, seg.r0 * 1.6), 2.2, 3.5, tmpColor);
        }
      }

      // 4. Living Buds (Dormant vs Swelling Crimson-Lime Buds!)
      let activeBudCount = 0;
      for (const bud of bonsai.buds) {
        if (bud.pruned || bud.state === 'SPENT') continue;
        const pSeg = bonsai.SegmentMap.get(bud.parentSegId);
        if (!pSeg || pSeg.pruned || pSeg.curT < 0.95) continue;

        if (bud.state === 'SWELLING') {
          activeBudCount++;
          // Glowing crimson-lime swelling spring bud (3月 bud break!)
          const pulse = 1.0 + Math.sin(timeSec * 6.0) * 0.15;
          const r = (2.2 + bud.swell * 2.4) * pulse;
          tmpColor.setRGB(0.95, 0.55 + bud.swell * 0.4, 0.35);
          pushSphere(bud.x, bud.y, bud.z + 2.0, r, r * 1.3, r, tmpColor);
        } else {
          // Small dormant axillary/trunk bud
          tmpColor.setRGB(0.75, 0.42, 0.35);
          pushSphere(bud.x, bud.y, bud.z + 1.5, 1.5, 1.8, 1.5, tmpColor);
        }
      }

      // 5. Palmate 5-Lobed Maple Leaves & Slender Reddish Petioles
      let activeLeafCount = 0;
      for (const lf of bonsai.leaves) {
        if (lf.pruned) continue;
        const pSeg = bonsai.SegmentMap.get(lf.parentSegId);
        if (!pSeg || pSeg.pruned) continue;

        activeLeafCount++;
        const isCutHighlight = hoveredDescSet.has(lf.parentSegId) || (activeTool === 'PINCH' && hoveredSegId === lf.parentSegId);

        // Gentle organic breeze sway
        const breeze = Math.sin(timeSec * 2.2 + lf.x * 0.05 + lf.y * 0.04) * 0.06;
        const curPetioleLen = lf.petioleLen * (0.3 + 0.7 * lf.age);
        const pAngle = lf.angle + breeze;

        const bladeBaseX = lf.x + Math.sin(pAngle) * curPetioleLen;
        const bladeBaseY = lf.y + Math.cos(pAngle) * curPetioleLen - 2.0 * lf.age;
        const bladeBaseZ = lf.z + 4.0 + lf.side * 3.0;

        // Slender Reddish-Coral Petiole (Photos 1, 2, 3, 4, 5)
        tmpColor.setRGB(isCutHighlight ? 1.0 : 0.85, isCutHighlight ? 0.3 : 0.32, 0.32);
        pushCylinder(lf.x, lf.y, lf.z, bladeBaseX, bladeBaseY, bladeBaseZ, 0.65, 0.55, tmpColor);

        // 5-Lobed Palmate Leaf Blade Instance
        if (leafIdx < MAX_LEAVES) {
          const radius = lf.maxRadius * (0.18 + 0.82 * Math.pow(lf.age, 0.82));
          dummyObj.position.set(bladeBaseX, bladeBaseY, bladeBaseZ);
          // Orient palmate leaf in the XY projection plane with slight 3D tilt for lighting
          dummyObj.rotation.set(0.22, lf.tiltZ * 0.35, -pAngle);
          dummyObj.scale.set(radius, radius, radius);
          dummyObj.updateMatrix();
          leafInstanced.setMatrixAt(leafIdx, dummyObj.matrix);

          if (isCutHighlight) {
            tmpColor.setRGB(1.0, 0.28, 0.38);
          } else if (seasonTheme === 'AUTUMN') {
            // Autumn Momiji crimson & fiery orange
            tmpColor.setHSL(0.03 + lf.hueOffset * 0.002, 0.88, 0.32 + lf.shadeLayer * 0.24);
          } else if (lf.age < 0.38) {
            // Newly sprouted March (3月) leaf: warm bronze-red / apricot transition to lime!
            const bronzeMix = 1.0 - (lf.age / 0.38);
            const hue = 0.05 * bronzeMix + (0.29 + lf.hueOffset * 0.002) * (1.0 - bronzeMix);
            tmpColor.setHSL(hue, 0.82, 0.36 + lf.shadeLayer * 0.22);
          } else {
            // Mature May/June (6月) lush emerald green canopy with depth layering (Photos 3 & 5)
            const hue = (bonsai.species === 'BONSAI_PINE' ? 0.38 : 0.31) + lf.hueOffset * 0.002;
            const light = 0.24 + lf.shadeLayer * 0.30;
            tmpColor.setHSL(hue, 0.78, light);
          }

          leafInstanced.setColorAt(leafIdx, tmpColor);
          leafIdx++;
        }
      }

      // 6. Falling Pruned Clippings Animation
      for (let i = bonsai.fallingClips.length - 1; i >= 0; i--) {
        const clip = bonsai.fallingClips[i];
        clip.x += clip.vx;
        clip.y += clip.vy;
        clip.vy -= 0.18;
        clip.alpha -= 0.035;
        if (clip.alpha <= 0) {
          bonsai.fallingClips.splice(i, 1);
          continue;
        }
        if (leafIdx < MAX_LEAVES) {
          dummyObj.position.set(clip.x, clip.y, clip.z + 10);
          dummyObj.rotation.set(0.3, 0.2, clip.alpha * 3.0);
          dummyObj.scale.set(16, 16, 16);
          dummyObj.updateMatrix();
          leafInstanced.setMatrixAt(leafIdx, dummyObj.matrix);
          tmpColor.setRGB(0.95 * clip.alpha, 0.35 * clip.alpha, 0.40 * clip.alpha);
          leafInstanced.setColorAt(leafIdx, tmpColor);
          leafIdx++;
        }
      }

      cylInstanced.count = cylIdx;
      cylInstanced.instanceMatrix.needsUpdate = true;
      if (cylInstanced.instanceColor) cylInstanced.instanceColor.needsUpdate = true;

      sphereInstanced.count = sphIdx;
      sphereInstanced.instanceMatrix.needsUpdate = true;
      if (sphereInstanced.instanceColor) sphereInstanced.instanceColor.needsUpdate = true;

      leafInstanced.count = leafIdx;
      leafInstanced.instanceMatrix.needsUpdate = true;
      if (leafInstanced.instanceColor) leafInstanced.instanceColor.needsUpdate = true;

      // Update Minimal Top Telemetry Bar
      document.getElementById('hudBuds').innerText = `${activeBudCount}`;
      document.getElementById('hudLeaves').innerText = `${activeLeafCount}`;
      document.getElementById('hudBranches').innerText = `${activeBranchCount}`;
      const baseTrunk = bonsai.segments[0];
      if (baseTrunk) {
        document.getElementById('trunkCaliberLabel').innerText = `${(baseTrunk.r0 * 1.45).toFixed(1)} mm`;
      }
      const yearNum = Math.floor(bonsai.simDays / 90) + 1;
      const monthNames = ['3月 (MAR)', '4月 (ABR)', '5月 (MAY)', '6月 (JUN)', '7月 (JUL)', '8月 (AGO)'];
      const mIdx = Math.floor((bonsai.simDays % 90) / 15) % monthNames.length;
      document.getElementById('simAgeLabel').innerText = `AÑO ${yearNum} // ${monthNames[mIdx]}`;
    }

    /* ====================================================================
       5. INTERACTIVE MOUSE HIT-TESTING & UI CONTROLS
       ==================================================================== */
    function distToSegment2D(px, py, x0, y0, x1, y1) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 0.001) return Math.hypot(px - x0, py - y0);
      const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / lenSq));
      return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
    }

    renderer.domElement.addEventListener('mousemove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      const worldX = orthoCamera.left + (ndcX + 1) * 0.5 * (orthoCamera.right - orthoCamera.left);
      const worldY = orthoCamera.bottom + (ndcY + 1) * 0.5 * (orthoCamera.top - orthoCamera.bottom);

      let bestSegId = null;
      let minDist = 14.0;

      for (const seg of bonsai.segments) {
        if (seg.pruned || seg.type === 'TRUNK' || seg.type === 'TRUNK_HEAD') continue;
        const curX1 = seg.x0 + (seg.x1 - seg.x0) * seg.curT;
        const curY1 = seg.y0 + (seg.y1 - seg.y0) * seg.curT;
        const d = distToSegment2D(worldX, worldY, seg.x0, seg.y0, curX1, curY1);
        if (d < minDist) {
          minDist = d;
          bestSegId = seg.id;
        }
      }

      hoveredSegId = bestSegId;
      hoveredDescSet.clear();
      if (hoveredSegId && activeTool === 'PRUNE') {
        const list = [];
        bonsai.collectDescendants(hoveredSegId, list);
        for (const id of list) hoveredDescSet.add(id);
      }
    });

    renderer.domElement.addEventListener('click', () => {
      bonsaiAudio.init();
      if (!hoveredSegId) return;

      if (activeTool === 'PRUNE') {
        if (bonsai.pruneSegment(hoveredSegId)) {
          bonsaiAudio.playSnip();
          hoveredSegId = null;
          hoveredDescSet.clear();
        }
      } else {
        if (bonsai.pinchOrWakeBud(hoveredSegId)) {
          bonsaiAudio.playBudPop();
          hoveredSegId = null;
        }
      }
    });

    // Tool Buttons
    const toolPrune = document.getElementById('toolPrune');
    const toolPinch = document.getElementById('toolPinch');

    function setTool(tool) {
      activeTool = tool;
      toolPrune.classList.toggle('active', tool === 'PRUNE');
      toolPinch.classList.toggle('active', tool === 'PINCH');
      renderer.domElement.className = tool === 'PRUNE' ? 'canvas-prune' : 'canvas-pinch';
    }
    setTool('PRUNE');
    toolPrune.addEventListener('click', () => setTool('PRUNE'));
    toolPinch.addEventListener('click', () => setTool('PINCH'));

    // Speed Controls
    const btnSpeedPause = document.getElementById('btnSpeedPause');
    const btnSpeed1x = document.getElementById('btnSpeed1x');
    const btnSpeed4x = document.getElementById('btnSpeed4x');

    function setSimSpeed(spd) {
      simSpeed = spd;
      btnSpeedPause.classList.toggle('active', spd === 0);
      btnSpeed1x.classList.toggle('active', spd === 1.0);
      btnSpeed4x.classList.toggle('active', spd === 4.0);
      document.getElementById('liveDot').className = spd === 0
        ? 'inline-block w-2 h-2 rounded-full bg-amber-400'
        : 'inline-block w-2 h-2 rounded-full bg-[#37ecc4] animate-pulse';
    }
    btnSpeedPause.addEventListener('click', () => setSimSpeed(0));
    btnSpeed1x.addEventListener('click', () => setSimSpeed(1.0));
    btnSpeed4x.addEventListener('click', () => setSimSpeed(4.0));

    document.getElementById('btnBurstSpring').addEventListener('click', () => {
      bonsaiAudio.playBudPop();
      bonsai.burstSpringFlush();
    });

    document.getElementById('btnUndo').addEventListener('click', () => {
      if (bonsai.undo()) bonsaiAudio.playBudPop();
    });

    document.getElementById('btnSoundToggle').addEventListener('click', (e) => {
      bonsaiAudio.enabled = !bonsaiAudio.enabled;
      e.target.innerText = bonsaiAudio.enabled ? '🔊' : '🔇';
    });

    document.getElementById('btnSeasonTheme').addEventListener('click', () => {
      seasonTheme = (seasonTheme === 'SPRING') ? 'AUTUMN' : 'SPRING';
      document.getElementById('seasonThemeText').innerText = seasonTheme === 'AUTUMN'
        ? 'OTOÑO (MOMIJI ROJO)'
        : 'PRIMAVERA / VERANO';
    });

    document.getElementById('btnBareStump').addEventListener('click', () => {
      bonsaiAudio.playBudPop();
      bonsai = new LivingBonsaiOrganism(currentSeed, currentSpecies);
      setSimSpeed(1.0);
    });

    document.getElementById('btnMutate').addEventListener('click', () => {
      currentSeed = Math.floor(Math.random() * 0xFFFFFF);
      document.getElementById('seedDisplay').innerText = '0x' + currentSeed.toString(16).toUpperCase().padStart(6, '0');
      const idNum = (currentSeed % 900 + 100);
      document.getElementById('specimenHeader').innerText = `${currentSpecies.replace('BONSAI_', 'ACER_')} #${idNum}`;
      bonsai = new LivingBonsaiOrganism(currentSeed, currentSpecies);
      for (let i = 0; i < 65; i++) bonsai.stepBiology(0.05);
    });

    document.getElementById('speciesSelect').addEventListener('change', (e) => {
      currentSpecies = e.target.value;
      bonsai = new LivingBonsaiOrganism(currentSeed, currentSpecies);
      for (let i = 0; i < 65; i++) bonsai.stepBiology(0.05);
    });

    /* ====================================================================
       6. MAIN GPU RENDER LOOP (60-120 FPS)
       ==================================================================== */
    let lastTime = performance.now();

    function animate(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (simSpeed > 0) {
        bonsai.stepBiology(dt * simSpeed);
      }

      syncBiologyToThreeScene(now * 0.001);

      // Pass 1: Render 3D Botanical Scene into offscreen RenderTarget
      renderer.setRenderTarget(sceneRT);
      renderer.render(bioScene, orthoCamera);

      // Pass 2: Project 3D RenderTarget through Fullscreen GPU ASCII Shader
      renderer.setRenderTarget(null);
      renderer.render(asciiPostScene, asciiPostCam);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
